name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: charts
          # Idempotency: a push that touches one chart re-runs `cr upload` for
          # every chart. Without skip_existing the action 422s when a release
          # tag already exists (see the 0.1.15 / 0.1.29 run failures), which
          # also aborts the `cr index` step and leaves gh-pages stale. With it,
          # already-published versions are skipped and only new ones publish.
          skip_existing: true
