name: Lint and Test Charts

# Catches chart regressions before they reach the release pipeline:
#   - helm lint on every chart
#   - helm template smoke renders (default + relaxed-dev + HA toggles)
#   - asserts no secret literals leak into rendered Secrets
#
# Runs on PRs and on pushes to main (the release workflow runs separately
# and only publishes; this is the gate that fails fast on bad templates).
on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  lint-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: helm lint (all charts)
        run: |
          set -euo pipefail
          fail=0
          for chart in charts/*/; do
            echo "::group::helm lint ${chart}"
            helm lint "${chart}" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      # nucel-server ships a fail-fast guard (required production secrets).
      # Render three shapes so a broken template is caught regardless of the
      # toggle combination an operator picks.
      - name: helm template — nucel-server (relaxed dev)
        run: |
          helm template t charts/nucel-server \
            --set secrets.requireProductionValues=false \
            --set prometheus.requireAuth=false \
            > /tmp/ns-dev.yaml
          test -s /tmp/ns-dev.yaml

      - name: helm template — nucel-server (production values)
        run: |
          helm template t charts/nucel-server \
            --set secrets.sessionKey=$(openssl rand -hex 64) \
            --set secrets.oidcPrivateKey=ci-test-oidc-key \
            --set secrets.metricsToken=$(openssl rand -base64 32) \
            --set secrets.secretEncryptionKey=$(openssl rand -hex 32) \
            > /tmp/ns-prod.yaml
          test -s /tmp/ns-prod.yaml

      - name: helm template — nucel-server (HA + all features)
        run: |
          helm template t charts/nucel-server \
            --set server.replicas=3 \
            --set secrets.sessionKey=$(openssl rand -hex 64) \
            --set secrets.oidcPrivateKey=ci-test-oidc-key \
            --set secrets.metricsToken=$(openssl rand -base64 32) \
            --set secrets.secretEncryptionKey=$(openssl rand -hex 32) \
            --set hpa.enabled=true \
            --set hpa.minReplicas=3 \
            --set hpa.maxReplicas=30 \
            --set podDisruptionBudget.enabled=true \
            --set priorityClass.create=true \
            --set priorityClassName=nucel-system \
            --set networkPolicy.enabled=true \
            --set basicAuth.enabled=true \
            --set basicAuth.password=ci-test-pass \
            --set prometheus.alerts.enabled=true \
            --set prometheus.serviceMonitor.enabled=true \
            --set metrics.alerts.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set storage.classes.registry.accessMode=ReadWriteMany \
            --set storage.classes.npm.accessMode=ReadWriteMany \
            --set storage.classes.artifacts.accessMode=ReadWriteMany \
            --set storage.classes.gitWorkspaces.accessMode=ReadWriteMany \
            --set storage.classes.pages.backend=s3 \
            --set storage.classes.pages.s3.bucket=ci-bucket \
            > /tmp/ns-ha.yaml
          grep -q "kind: HorizontalPodAutoscaler" /tmp/ns-ha.yaml
          grep -q "kind: PodDisruptionBudget" /tmp/ns-ha.yaml
          grep -q "kind: NetworkPolicy" /tmp/ns-ha.yaml
          grep -q "kind: PrometheusRule" /tmp/ns-ha.yaml
          grep -q "kind: ServiceMonitor" /tmp/ns-ha.yaml
          grep -q "kind: PriorityClass" /tmp/ns-ha.yaml
          grep -q "basic-auth" /tmp/ns-ha.yaml
          # HA SHAPES — assert the actual values, not just resource presence,
          # so a regression that drops HPA bounds / AZ spread / RWX is caught.
          echo "-> HPA min/max bounds"
          grep -q "minReplicas: 3"  /tmp/ns-ha.yaml
          grep -q "maxReplicas: 30" /tmp/ns-ha.yaml
          echo "-> topologySpread across hostname AND zone"
          grep -q "topologyKey: kubernetes.io/hostname"        /tmp/ns-ha.yaml
          grep -q "topologyKey: topology.kubernetes.io/zone"   /tmp/ns-ha.yaml
          echo "-> server pod carries the system PriorityClass"
          grep -q "priorityClassName: nucel-system" /tmp/ns-ha.yaml
          echo "-> all shared classes render RWX PVCs (registry/npm/artifacts/gitWorkspaces)"
          test "$(grep -c 'ReadWriteMany' /tmp/ns-ha.yaml)" -ge 4

      # The production overlay is the documented prod entrypoint; render it
      # exactly as values-production.yaml ships (ExternalSecrets per-key map +
      # secrets.create=false + S3/RWX storage) so a drift between the overlay
      # and the templates fails CI instead of `helm upgrade` in prod.
      - name: helm template — nucel-server (values-production.yaml overlay)
        run: |
          helm template t charts/nucel-server \
            -f charts/nucel-server/values-production.yaml \
            --set externalSecrets.secretStoreRef.name=aws-secrets-manager \
            --set storage.classes.pages.s3.bucket=ci-bucket \
            --set storage.classes.gitWorkspaces.s3.bucket=ci-bucket \
            > /tmp/ns-prod.yaml
          test -s /tmp/ns-prod.yaml
          echo "-> ExternalSecret owns the Secret (per-key data map, no chart Secret)"
          grep -q "kind: ExternalSecret" /tmp/ns-prod.yaml
          grep -q "secretKey: NUCEL_OIDC_PRIVATE_KEY" /tmp/ns-prod.yaml
          grep -q "secretKey: NUCEL_METRICS_TOKEN"   /tmp/ns-prod.yaml
          # secrets.create=false in the overlay -> no chart-managed data Secret
          if grep -qE "^kind: Secret$" /tmp/ns-prod.yaml; then
            echo "FAIL: chart-managed Secret rendered despite secrets.create=false (would fight ESO)"
            exit 1
          fi
          echo "-> HA shapes present in the overlay render"
          grep -q "minReplicas: 3"  /tmp/ns-prod.yaml
          grep -q "maxReplicas: 30" /tmp/ns-prod.yaml
          grep -q "kind: PodDisruptionBudget" /tmp/ns-prod.yaml
          grep -q "kind: PriorityClass" /tmp/ns-prod.yaml
          grep -q "topologyKey: topology.kubernetes.io/zone" /tmp/ns-prod.yaml
          test "$(grep -c 'ReadWriteMany' /tmp/ns-prod.yaml)" -ge 4

      # Audit #22 — SurrealDB NetworkPolicy + non-root/restricted
      # securityContext. Render both NetworkPolicy shapes (in-chart ingress
      # lock-down vs external egress lock-down) and assert the seed/migrate
      # Jobs + SurrealDB container carry the hardened securityContext.
      - name: helm template — surrealdb netpol + securityContext (audit #22)
        run: |
          set -euo pipefail
          # In-chart SurrealDB: ingress NetworkPolicy on the DB pods admitting
          # only nucel client pods; seed + migrate Jobs hardened.
          helm template t charts/nucel-server \
            --set secrets.requireProductionValues=false \
            --set prometheus.requireAuth=false \
            --set surrealdb.deploy=true \
            --set surrealdb.networkPolicy.enabled=true \
            --set seed.enabled=true --set seed.mountRepos=true \
            --set worker.enabled=true \
            > /tmp/ns-sec.yaml
          echo "-> SurrealDB ingress NetworkPolicy renders, selecting surrealdb pods"
          grep -q "name: t-nucel-server-surrealdb$" /tmp/ns-sec.yaml
          grep -q "app.kubernetes.io/name: surrealdb" /tmp/ns-sec.yaml
          echo "-> SurrealDB container carries drop-ALL + RuntimeDefault"
          grep -q "type: RuntimeDefault" /tmp/ns-sec.yaml
          echo "-> seed + migrate Jobs present and hardened (no bare root containers)"
          grep -q "component: seed" /tmp/ns-sec.yaml
          grep -q "component: migrate" /tmp/ns-sec.yaml
          # Every NUCEL-image container drops ALL caps; count must cover
          # server + worker + seed + migrate + surrealdb (>=5 drop blocks).
          # Indentation-agnostic (a future re-nest of a securityContext block
          # must not silently hollow out this assertion).
          test "$(grep -cE '^\s*- ALL$' /tmp/ns-sec.yaml)" -ge 5
          # External / managed SurrealDB: egress lock-down on the client pods.
          helm template t charts/nucel-server \
            --set secrets.requireProductionValues=false \
            --set prometheus.requireAuth=false \
            --set surrealdb.networkPolicy.enabled=true \
            --set 'surrealdb.networkPolicy.externalPeers[0].ipBlock.cidr=10.0.32.0/20' \
            --show-only templates/surrealdb-networkpolicy.yaml \
            > /tmp/ns-sec-ext.yaml
          echo "-> external SurrealDB egress NetworkPolicy renders"
          grep -q "name: t-nucel-server-surrealdb-egress$" /tmp/ns-sec-ext.yaml
          grep -q "10.0.32.0/20" /tmp/ns-sec-ext.yaml
          grep -q "policyTypes:" /tmp/ns-sec-ext.yaml
          grep -q "    - Egress" /tmp/ns-sec-ext.yaml
          # deploy=false with NO externalPeers must render NO object (guidance
          # comment only) — avoids an over-broad policy.
          helm template t charts/nucel-server \
            --set secrets.requireProductionValues=false \
            --set prometheus.requireAuth=false \
            --set surrealdb.networkPolicy.enabled=true \
            --show-only templates/surrealdb-networkpolicy.yaml \
            > /tmp/ns-sec-noop.yaml || true
          if grep -q "kind: NetworkPolicy" /tmp/ns-sec-noop.yaml; then
            echo "FAIL: external SurrealDB with no externalPeers rendered an over-broad NetworkPolicy"
            exit 1
          fi
          # PR #1 MAJOR-1: deploy=false egress is default-deny for the client
          # pods, so the default escape hatch (allowAllOtherEgress=true) MUST
          # emit a broad allow-all egress rule alongside the DB-port rule —
          # otherwise enabling the policy severs S3/SMTP/etc.
          echo "-> escape hatch: default render includes broad allow-all egress (- {})"
          grep -qE '^    - \{\}$' /tmp/ns-sec-ext.yaml
          # True lock-down (allowAllOtherEgress=false) must render DNS + DB
          # port + the operator-supplied extraEgress, and NO allow-all rule.
          helm template t charts/nucel-server \
            --set secrets.requireProductionValues=false \
            --set prometheus.requireAuth=false \
            --set surrealdb.networkPolicy.enabled=true \
            --set surrealdb.networkPolicy.allowAllOtherEgress=false \
            --set 'surrealdb.networkPolicy.externalPeers[0].ipBlock.cidr=10.0.32.0/20' \
            --set 'surrealdb.networkPolicy.extraEgress[0].ports[0].protocol=TCP' \
            --set 'surrealdb.networkPolicy.extraEgress[0].ports[0].port=443' \
            --show-only templates/surrealdb-networkpolicy.yaml \
            > /tmp/ns-sec-lock.yaml
          echo "-> true lock-down: DNS(53) + DB(8000) + extraEgress(443), no allow-all"
          grep -q "port: 53" /tmp/ns-sec-lock.yaml
          grep -q "port: 8000" /tmp/ns-sec-lock.yaml
          grep -q "port: 443" /tmp/ns-sec-lock.yaml
          if grep -qE '^    - \{\}$' /tmp/ns-sec-lock.yaml; then
            echo "FAIL: allowAllOtherEgress=false still rendered a broad allow-all egress rule"
            exit 1
          fi
          # PR #1 MAJOR-2: requesting a lock-down while the main networkPolicy
          # is on in its default allow-all egress mode is a silent no-op
          # (NetworkPolicies union). The chart MUST fail fast.
          echo "-> additive-conflict guard fails fast on the silent no-op combo"
          if helm template t charts/nucel-server \
            --set secrets.requireProductionValues=false \
            --set prometheus.requireAuth=false \
            --set networkPolicy.enabled=true \
            --set surrealdb.networkPolicy.enabled=true \
            --set surrealdb.networkPolicy.allowAllOtherEgress=false \
            --set 'surrealdb.networkPolicy.externalPeers[0].ipBlock.cidr=10.0.32.0/20' \
            --show-only templates/surrealdb-networkpolicy.yaml > /dev/null 2>&1; then
            echo "FAIL: expected fail-fast on networkPolicy.enabled + denyAll=false + lock-down, but render succeeded"
            exit 1
          fi
          # Same combo but with denyAll=true must render (no conflict).
          helm template t charts/nucel-server \
            --set secrets.requireProductionValues=false \
            --set prometheus.requireAuth=false \
            --set networkPolicy.enabled=true \
            --set networkPolicy.egress.denyAll=true \
            --set surrealdb.networkPolicy.enabled=true \
            --set surrealdb.networkPolicy.allowAllOtherEgress=false \
            --set 'surrealdb.networkPolicy.externalPeers[0].ipBlock.cidr=10.0.32.0/20' \
            --set 'surrealdb.networkPolicy.extraEgress[0].ports[0].protocol=TCP' \
            --set 'surrealdb.networkPolicy.extraEgress[0].ports[0].port=443' \
            --show-only templates/surrealdb-networkpolicy.yaml > /dev/null
          echo "OK: audit #22 securityContext + SurrealDB NetworkPolicy shapes verified"

      # The storage guard must FAIL a multi-replica install on RWO/emptyDir —
      # assert it actually blocks (the regression that #244 fixed).
      - name: helm template — storage guard rejects RWO multi-replica
        run: |
          if helm template t charts/nucel-server \
               --set secrets.requireProductionValues=false \
               --set prometheus.requireAuth=false \
               --set hpa.enabled=true \
               --set storage.classes.registry.accessMode=ReadWriteOnce \
               > /tmp/ns-bad.yaml 2>/tmp/ns-bad-err.txt; then
            echo "FAIL: storage guard did NOT reject RWO registry under HPA"
            exit 1
          fi
          grep -qi "ReadWriteMany\|multi-replica\|ReadWriteOnce\|storage" /tmp/ns-bad-err.txt
          echo "OK: storage.validate guard blocked RWO + HPA as expected"

      - name: helm template — agent-operator (default)
        run: |
          helm template t charts/agent-operator > /tmp/ao-default.yaml
          test -s /tmp/ao-default.yaml

      - name: helm template — agent-operator (HA)
        run: |
          helm template t charts/agent-operator \
            --set operator.replicas=2 \
            --set podDisruptionBudget.enabled=true \
            --set podDisruptionBudget.minAvailable=1 \
            --set networkPolicy.enabled=true \
            --set monitoring.serviceMonitor.enabled=true \
            --set 'operator.topologySpreadConstraints[0].maxSkew=1' \
            --set 'operator.topologySpreadConstraints[0].topologyKey=topology.kubernetes.io/zone' \
            --set 'operator.topologySpreadConstraints[0].whenUnsatisfiable=ScheduleAnyway' \
            --set 'operator.topologySpreadConstraints[0].labelSelector.matchLabels.app\.kubernetes\.io/name=agent-operator' \
            > /tmp/ao-ha.yaml
          grep -q "kind: PodDisruptionBudget" /tmp/ao-ha.yaml
          grep -q "kind: NetworkPolicy" /tmp/ao-ha.yaml
          grep -q "kind: ServiceMonitor" /tmp/ao-ha.yaml
          # HA SHAPES: 2-replica leader-elected operator, AZ spread, PDB floor.
          grep -q "replicas: 2" /tmp/ao-ha.yaml
          grep -q "minAvailable: 1" /tmp/ao-ha.yaml
          grep -q "topologyKey: topology.kubernetes.io/zone" /tmp/ao-ha.yaml

      # Secret hygiene: with NO secret values supplied, every operator-provided
      # secret value must come from values — never a baked-in literal. The
      # conditional keys below are wrapped in `{{- if .Values... }}` and so must
      # be ENTIRELY ABSENT from the render when no value is set. (The only
      # auto-generated material is the dev-fallback session key + SSH host key,
      # which are intentional and not operator secrets.)
      - name: assert no secret literals
        run: |
          set -euo pipefail
          # Keys that are gated behind a values check — absent unless supplied.
          for key in NUCEL_OIDC_PRIVATE_KEY NUCEL_METRICS_TOKEN ANTHROPIC_API_KEY \
                     NUCEL_OPENROUTER_KEY NUCEL_GIT_USER NUCEL_GIT_PASSWORD \
                     NUCEL_S3_ACCESS_KEY_ID NUCEL_S3_SECRET_ACCESS_KEY; do
            # Match only a real YAML data line "  KEY: <value>" (2-space indent,
            # value present) — not env var refs ("- name:" / "key:") or comments.
            if grep -nE "^  ${key}: .+" /tmp/ns-dev.yaml; then
              echo "FAIL: ${key} rendered with a value when none was supplied (literal leak)"
              exit 1
            fi
          done
          # agent-operator: with no secrets supplied, both Secrets must render
          # with NO data keys at all (every key is conditional on a value).
          helm template t charts/agent-operator > /tmp/ao-secrets.yaml
          if grep -nE "^  (github-token|anthropic-api-key|api-token|github-webhook-secret|github-app-private-key): .+" /tmp/ao-secrets.yaml; then
            echo "FAIL: agent-operator Secret carries a literal with no value supplied"
            exit 1
          fi
          echo "OK: no secret literals detected"
