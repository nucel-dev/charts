# -- nucel-server image
#
# Fix M1: `tag` defaults to empty so the chart falls back to
# `Chart.AppVersion` (pinned per release in Chart.yaml). Operators who
# previously relied on a moving `:latest` tag must now set
# `--set image.tag=latest` explicitly — picking up un-pinned images was
# the original failure mode this guards against.
image:
  repository: ghcr.io/nucel-dev/nucel-server
  tag: ""
  pullPolicy: IfNotPresent

# -- Server deployment
server:
  replicas: 1
  port: 17321
  sshPort: 2222
  # Set to "true" to enable closed-beta / invite-only mode. When true,
  # registration requires a valid invite token; open signup is disabled.
  inviteOnly: false
  # Comma-separated list of usernames that receive operator super-admin
  # access (the /admin portal and /api/v1/admin/* endpoints). Empty = no
  # admins (fail-closed). Example: "alice,bob"
  adminUsers: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Rolling-update strategy for the server Deployment. Surge one extra
  # pod, never drop below the desired count during a rollout, so the
  # service stays at full capacity through upgrades. Set to `{}` to fall
  # back to the Kubernetes default (RollingUpdate 25%/25%).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Pin server pods to a node pool. Empty = schedule anywhere. The
  # cluster-wide `affinity` / `topologySpreadConstraints` /
  # `priorityClassName` keys (defined lower in this file) drive AZ spread
  # and anti-affinity for the server Deployment.
  nodeSelector: {}
  tolerations: []
  # Liveness/readiness/startup probe timings for the server container.
  # `startup` is the slow-boot gate: SurrealDB connect + schema check +
  # SSH host-key load can take a few seconds on a cold pod, and until the
  # startup probe passes the liveness probe is NOT evaluated — so a slow
  # boot can't be misread as a crash-loop. failureThreshold * periodSeconds
  # (30 * 5s = 150s here) is the hard ceiling before the pod is restarted.
  # Leave `startup.enabled: false` to fall back to initialDelaySeconds on
  # the liveness probe (the pre-0.1.36 behaviour).
  probes:
    startup:
      enabled: true
      periodSeconds: 5
      failureThreshold: 30
      timeoutSeconds: 3
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

# -- Pod- and container-level SecurityContext for the server / worker /
# worker-pool Deployments.
#
# IMPORTANT — the published `ghcr.io/nucel-dev/nucel-server` image runs as
# root (uid 0: see docker/Dockerfile.server, debian:bookworm-slim with no
# USER) and the server writes to its PVC mounts (/data/*) plus the Vite
# manifest dir, so `runAsNonRoot: true` and `readOnlyRootFilesystem: true`
# are NOT defaulted on — flipping them on the stock image will crash-loop
# the pod. They are exposed here so operators who rebuild a nonroot image
# (`USER 65532` + a writable fsGroup on the PVCs) can switch the full
# restricted profile on without forking the chart.
#
# What IS on by default (safe for the root image, satisfies the bulk of
# Pod Security "restricted" minus the runAsNonRoot/RORFS pair):
#   - allowPrivilegeEscalation: false
#   - capabilities.drop: ["ALL"]
#   - seccompProfile: RuntimeDefault
#
# Both blocks are passed through verbatim (toYaml) — set either to `{}` to
# emit nothing, or extend with runAsUser/fsGroup/runAsNonRoot/
# readOnlyRootFilesystem for a hardened image.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  # runAsNonRoot: true        # enable only on a nonroot-rebuilt image
  # runAsUser: 65532
  # runAsGroup: 65532
  # fsGroup: 65532            # needed so the non-root uid can write the PVCs
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  # runAsNonRoot: true        # enable only on a nonroot-rebuilt image
  # runAsUser: 65532
  # readOnlyRootFilesystem: true   # server writes /app + /data, leave off
  #                                  unless you mount emptyDirs over them

# -- NetworkPolicy for the nucel-server namespace (defense in depth).
#
# Off by default so the chart still renders on clusters without a CNI that
# enforces NetworkPolicy (the object is inert there, but we keep the
# surface opt-in for parity with the other security toggles). When
# enabled, the policy:
#   - applies to server + worker + worker-pool pods (selected by
#     app.kubernetes.io/name=nucel)
#   - INGRESS: allows the HTTP (17321) + SSH (2222) ports from anywhere by
#     default (the ingress controller / LB lives in another namespace);
#     narrow `ingress.from` to your ingress-controller namespace for a
#     tighter policy.
#   - EGRESS: allowed to everywhere by default (the server talks to
#     SurrealDB/TiKV, S3, SMTP, the K8s API, arbitrary webhook targets and
#     git remotes — an allowlist here is install-specific). DNS (UDP/TCP
#     53) is always permitted. Set `egress.denyAll: true` + populate
#     `egress.to` to lock egress down to known CIDRs/namespaces.
networkPolicy:
  enabled: false
  # Extra ingress `from` peers (namespaceSelector / podSelector / ipBlock).
  # Empty = allow the server ports from any source.
  ingress:
    from: []
  egress:
    # When false (default) the policy allows all egress. When true, only
    # DNS + the entries under `egress.to` are permitted.
    denyAll: false
    to: []

# -- Worker deployment (standalone JobRunner).
#
# Disabled by default — the in-process runner inside nucel-server keeps
# the queue moving for low-volume installs. Enable + bump replicas when
# bg_job depth (Prometheus: nucel_bg_job_depth) starts growing during
# traffic spikes. The same `bg_job` table is consumed by both — the
# atomic claim guarantees no row is processed twice.
#
# PVC NOTE: the chart's PVCs are ReadWriteOnce. The worker mounts
# /data/repos read-only for the rebuild_pr_diff_cache handler, which
# means the worker pod must land on the same node as the server pod
# unless you switch storage.storageClassName to a ReadWriteMany class
# (e.g. NFS, CephFS, Longhorn-RWX). For single-node Hetzner clusters
# this is a non-issue.
worker:
  enabled: false
  replicas: 1
  # Independent batch/poll knobs in case the worker pool wants to be
  # more aggressive than the in-server runner. Empty = inherit defaults
  # from the binary.
  batchSize: ""
  pollMs: ""
  leaseSeconds: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Pod scheduling for the standalone worker Deployment. Defaults to a
  # soft pod anti-affinity by hostname so worker replicas spread across
  # nodes; pair `topologySpreadConstraints` with a zone key for AZ
  # spread. All keys are overridable / emptyable.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: nucel
                app.kubernetes.io/component: worker
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: nucel
          app.kubernetes.io/component: worker

  # Per-kind worker pools. Each entry becomes its own Deployment
  # (`nucel-worker-<name>`). Pinning specific job kinds to dedicated
  # pools means a webhook storm on `deliver_app_webhook` can't starve
  # latency-sensitive `rebuild_pr_diff_cache` work running elsewhere.
  #
  # Optional shardIndex/shardCount adds hash partitioning across pods
  # within a pool — only rows with bg_job.shard_key % shardCount ==
  # shardIndex are claimed by this pool. Useful when scaling a single
  # high-volume kind to many replicas.
  #
  # Example:
  #   pools:
  #     - name: webhooks
  #       replicas: 3
  #       kinds: ["deliver_app_webhook", "deliver_repo_webhook"]
  #       batchSize: 16
  #       pollMs: 250
  #     - name: pr-diffs
  #       replicas: 1
  #       kinds: ["rebuild_pr_diff_cache"]
  #       resources:
  #         requests: { cpu: 500m, memory: 512Mi }
  #         limits: { cpu: 2000m, memory: 2Gi }
  pools: []

# -- Schema migrations (Fix M5).
#
# When enabled, the chart renders a pre-install / pre-upgrade Helm Hook
# Job that runs the server binary with `NUCEL_MIGRATE_ONLY=1` — it
# applies the SurrealDB SCHEMAFULL schema exactly once and exits 0.
# Server pods then start with `NUCEL_SKIP_SCHEMA=1` so they don't
# re-apply on boot.
#
# Before this fix every server pod called `apply_schema` at startup,
# which races during rolling restarts: pod A and pod B both racing to
# CREATE/DEFINE the same SCHEMAFULL tables produces "table already
# exists" errors and occasional partially-applied schemas.
#
# Default `true` — disable only for local dev with a single replica
# where the race window doesn't matter, or when applying schema out of
# band.
migrations:
  enabled: true
  # Hook lifecycle:
  #   hook-weight: 0           → runs before everything else
  #   delete-policy:
  #     before-hook-creation   → previous Job (if any) deleted before re-run
  #     hook-succeeded         → success cleans up automatically; failures
  #                              persist for `kubectl logs job/...` debugging
  backoffLimit: 2
  # Hard ceiling on migration runtime (seconds). 600s = 10min headroom;
  # actual apply_schema runs in <30s on a warm cluster.
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Domain and OIDC
domain: nucel.dev
oidc:
  issuer: "https://nucel.dev"

# -- Email backend (MVP audit L11 — SMTP-based, no SES SDK).
#
# `smtpUrl` is required for any kind of mail to leave the cluster. When
# unset, the server runs in graceful no-op mode (logs each would-send
# warning) so dev / preview environments still boot. The URL goes into
# a dedicated Secret (`<release>-email`) so SES rotation doesn't touch
# the main nucel-secret blob.
#
# Format: `smtps://USER:PASS@HOST:PORT` for implicit TLS (SES on 465),
# or `smtp://USER:PASS@HOST:PORT` for STARTTLS. URL-encode any `/` or
# `+` chars in the password (SES SMTP creds frequently contain them).
#
# `from` is the `From:` header on every outbound message; must be a
# domain SES is authorized to send for. `baseUrl` is the public origin
# used to build verification / reset links — it should match the
# ingress host or the email link will land on the wrong server.
#
# `requireVerifiedEmail` is a placeholder flag for the future
# email-verification *requirement* (block login / write operations
# until the user verifies). The handlers ship today as opt-in: tokens
# get minted and emailed on signup, but the user can still sign in
# while unverified. Flip this true once the frontend + middleware
# are wired (a later MVP item, not this audit fix).
email:
  smtpUrl: ""
  from: "Nucel <no-reply@nucel.dev>"
  baseUrl: "https://nucel.dev"
  requireVerifiedEmail: false

# -- Session cookies
cookies:
  # Secure flag — required over HTTPS, breaks login over plain HTTP.
  # Set to "1" in any TLS-fronted environment (default), "0" only for
  # local-dev plaintext.
  secure: "1"

# -- SurrealDB
surrealdb:
  # Set to true only when you want the Helm chart to deploy SurrealDB itself.
  # In production the infra Terraform module (modules/surrealdb) manages the
  # StatefulSet directly; keep this false so the chart does not create a
  # competing resource.
  deploy: false
  image: surrealdb/surrealdb:v3.0.5
  # tikvEndpoint: when non-empty, SurrealDB starts in TiKV mode using this
  # PD address (e.g. "pd-pd.tikv-system.svc.cluster.local:2379"). The
  # volumeClaimTemplates block is omitted in TiKV mode — data lives in the
  # TiKV cluster, not a local PVC.
  tikvEndpoint: ""
  storage: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Container-level securityContext for the SurrealDB container. The
  # StatefulSet already ships a pod-level securityContext
  # (runAsNonRoot/runAsUser/runAsGroup/fsGroup 1000 — the surrealdb image
  # runs fine non-root). This adds the container-level restricted profile
  # to match the server/worker pods: drop ALL caps, no privilege
  # escalation, RuntimeDefault seccomp. `readOnlyRootFilesystem` is left
  # off because SurrealDB writes its embedded RocksDB/surrealkv store under
  # /data (a PVC mount) but may also touch the rootfs for temp files; flip
  # it on if your image tolerates it. Set to `{}` to emit nothing.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
    # readOnlyRootFilesystem: true   # enable only if the image tolerates it
  # -- NetworkPolicy guarding SurrealDB (audit #22).
  #
  # SurrealDB speaks plaintext ws:// on :8000 with no transport encryption,
  # so any pod that can route to its Service can attempt to authenticate
  # (and brute-force NUCEL_DB_USER/NUCEL_DB_PASS). This policy restricts
  # who may reach it.
  #
  # Two shapes, picked by `surrealdb.deploy`:
  #   - deploy=true  → the chart owns the SurrealDB StatefulSet, so it
  #                    renders an INGRESS NetworkPolicy on the surrealdb
  #                    pods that allows :8000 ONLY from the nucel client
  #                    pods (server + worker + worker-pool + seed +
  #                    migrate — all carry the chart selector labels
  #                    app.kubernetes.io/name=<chart> + instance=<release>)
  #                    plus any extra peers under `ingress.from`. Every
  #                    other source is denied (default-deny once a
  #                    NetworkPolicy selects the pod).
  #   - deploy=false → SurrealDB is external/managed (Terraform
  #                    modules/surrealdb). The chart can't put an ingress
  #                    policy on pods it doesn't own, so it renders an
  #                    EGRESS NetworkPolicy on the nucel client pods that
  #                    only permits DB egress to `externalPeers` (the
  #                    SurrealDB endpoint CIDR/namespace). You must ALSO
  #                    firewall the DB side — see PRODUCTION_HARDENING.md
  #                    "SurrealDB network isolation".
  #
  # Off by default so the chart still renders on clusters whose CNI does
  # not enforce NetworkPolicy (Calico/Cilium/etc. required for it to bite).
  #
  # !!  EGRESS DEFAULT-DENY WARNING (deploy=false path) !!
  # When deploy=false this block renders an EGRESS NetworkPolicy on the
  # nucel client pods (server / worker / worker-pool / seed / migrate). A
  # NetworkPolicy with policyTypes:[Egress] makes egress DEFAULT-DENY for
  # the pods it selects — only the rules it lists are allowed. The server
  # needs FAR more than the DB port: S3 over HTTPS:443 (NUCEL_S3_* wired in
  # configmap.yaml), SMTP, outbound webhooks, the OIDC issuer, git remotes
  # and container registries. So this policy ships an escape hatch
  # (`allowAllOtherEgress: true`, below) that keeps all non-DB egress open
  # by default — turning the policy on does NOT silently sever S3/SMTP/etc.
  # Flip `allowAllOtherEgress: false` for a TRUE lock-down, and then you
  # MUST enumerate every required peer under `extraEgress` (443 to
  # S3/OIDC/webhooks/registry, the SMTP port, …) or the platform breaks.
  #
  # !!  ADDITIVE-POLICY CONFLICT (deploy=false path) !!
  # NetworkPolicies are additive (union). With the main `networkPolicy`
  # block ALSO enabled at its default `egress.denyAll: false`, that policy
  # emits a `- {}` allow-all egress rule which UNIONs with — and nullifies
  # — any egress restriction here. The chart fails fast on that exact silent
  # no-op: a true SurrealDB egress lock-down (allowAllOtherEgress=false)
  # requires EITHER networkPolicy.enabled=false OR
  # networkPolicy.egress.denyAll=true. See PRODUCTION_HARDENING.md →
  # "SurrealDB network isolation".
  networkPolicy:
    enabled: false
    # Extra ingress `from` peers allowed to reach :8000 when deploy=true
    # (in addition to the in-namespace nucel client pods, which are always
    # allowed). Use to admit a DB admin/backup pod in another namespace.
    # Each entry is a standard NetworkPolicyPeer
    # (namespaceSelector / podSelector / ipBlock).
    ingress:
      from: []
    # When deploy=false: the peers the nucel client pods are allowed to
    # reach on the DB port for egress. Empty = no egress restriction is
    # rendered (the policy degrades to ingress-only / no-op for the
    # external case). Set this to the SurrealDB endpoint's ipBlock or the
    # namespaceSelector of the namespace that hosts the external DB.
    #   externalPeers:
    #     - ipBlock:
    #         cidr: 10.0.32.0/20      # SurrealDB subnet
    externalPeers: []
    # deploy=false EGRESS ESCAPE HATCH. When true (default), the egress
    # policy ALSO emits a broad `- {}` allow-all rule so the client pods
    # keep their S3/SMTP/webhook/OIDC/git/registry egress — i.e. enabling
    # the policy scopes the DB port WITHOUT severing everything else. The
    # DB-port rule is then informational (the union with `- {}` allows all
    # egress anyway); use it together with a DB-side firewall (the real
    # control for the external case). Set to FALSE for a true egress
    # lock-down — only DNS, the DB port and `extraEgress` survive, so you
    # must enumerate every other required peer under `extraEgress`.
    allowAllOtherEgress: true
    # deploy=false, allowAllOtherEgress=false: additional egress rules the
    # operator MUST supply so the server's non-DB traffic keeps flowing
    # under the lock-down. Each entry is a full NetworkPolicyEgressRule
    # ({ to: [...], ports: [...] }). Example covering S3/HTTPS + SMTP:
    #   extraEgress:
    #     - ports:
    #         - { protocol: TCP, port: 443 }   # S3 / OIDC / webhooks / registry
    #         - { protocol: TCP, port: 587 }   # SMTP submission
    extraEgress: []
    # deploy=false: optional `to` peers that scope the DNS (port 53) egress
    # rule. Empty = DNS allowed to anywhere (matches the main client
    # policy). Set to the kube-dns pods to tighten it, e.g.:
    #   dnsPeers:
    #     - namespaceSelector:
    #         matchLabels: { kubernetes.io/metadata.name: kube-system }
    #       podSelector:
    #         matchLabels: { k8s-app: kube-dns }
    dnsPeers: []
    # The port SurrealDB listens on (ws). Matches the Service/containerPort.
    port: 8000

# -- Persistent storage sizes
#
# storageClassName: empty falls back to the cluster default StorageClass.
# On EKS Auto Mode the default is `gp2` (older AMI) or unset — recommended
# override is `gp3` (better IOPS / throughput / cost) plus
# `volumeBindingMode: WaitForFirstConsumer` on the StorageClass for
# correct multi-AZ scheduling (the volume is provisioned in whichever AZ
# the pod is scheduled on, not eagerly in some random AZ). See
# PRODUCTION_HARDENING.md → "Storage class (EKS)" for the recommended
# StorageClass manifest. Leaving the default empty so the chart still
# renders on non-EKS clusters (Hetzner, k3s, etc.).
storage:
  repos: 50Gi
  ciData: 50Gi
  registry: 20Gi
  npm: 10Gi
  # Recommended for EKS: "gp3" (with a StorageClass that sets
  # volumeBindingMode: WaitForFirstConsumer for multi-AZ correctness).
  storageClassName: ""

  # ───────────────────────────────────────────────────────────────────────
  # Per-data-class storage strategy (#236 / #244).
  #
  # The ORIGINAL bug (#244): Pages assets were written to the container's
  # ephemeral filesystem (`/data/pages`, never mounted), so they were wiped
  # on every pod cycle AND invisible to sibling replicas (50% 404 race). The
  # registry / npm / artifact PVCs are ReadWriteOnce, which cannot attach to
  # more than one pod — the Multi-Attach errors hit under HPA / replicas > 1.
  #
  # The FIX: pick a backend per data class. For data that several replicas
  # must read identically, choose `s3` (object storage, IRSA-authenticated)
  # where the binary supports it, or a ReadWriteMany PVC (EFS / NFS / CephFS)
  # where it doesn't.
  #
  # backend:
  #   s3        — object storage shared across all replicas. ONLY valid for
  #               `pages` and `repos`/`gitWorkspaces` (the binary speaks S3
  #               for those two; the chart `fail`s if you set it elsewhere).
  #               Authenticate via IRSA (set serviceAccount.annotations) or
  #               static keys under the class's `s3.*` block.
  #   pvc       — a PersistentVolumeClaim. Set `accessMode: ReadWriteMany`
  #               for multi-replica (EFS/NFS/CephFS); ReadWriteOnce is
  #               single-replica only and the chart `fail`s if RWO is paired
  #               with replicas > 1 or HPA on a shared class.
  #   emptyDir  — ephemeral per-pod scratch. Single-replica only for shared
  #               classes (chart `fail`s otherwise). Fine for `workspaces`
  #               (CI build scratch that is recreated each run).
  #
  # Data classes:
  #   pages          static Pages assets        → s3 (recommended) | pvc(RWX)
  #   registry       OCI container blobs        → pvc(RWX) | pvc(RWO,1-rep)
  #   npm            npm tarballs               → pvc(RWX) | pvc(RWO,1-rep)
  #   artifacts      CI artifacts + logs        → pvc(RWX) | pvc(RWO,1-rep)
  #   gitWorkspaces  bare git repos (/data/repos hot cache; also the
  #                  worker's read-only mount)  → pvc(RWX) | s3(cold tier)
  #   workspaces     CI checkout scratch        → emptyDir (default)
  #
  # NOTE: registry / npm / artifacts are filesystem-only in the nucel-server
  # binary today (no S3 driver) — `backend: s3` is rejected for them. For
  # multi-replica these MUST use a ReadWriteMany class. `gitWorkspaces` always
  # keeps a local PVC as the hot cache even when `s3` is enabled (the S3
  # backend is a cold tier; ensure_local() faults repos back in on access).
  #
  # Leaving `storage.classes` empty preserves the legacy behaviour (RWO PVCs
  # sized from storage.repos/ciData/registry/npm, pages on emptyDir) so
  # existing single-replica installs upgrade unchanged.
  classes:
    pages:
      # s3 strongly recommended for any multi-replica / HPA install.
      backend: emptyDir
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClassName: ""
      s3:
        # Empty bucket/region/endpoint fall back to repoStorage.s3.* (same
        # bucket, different prefix) — matches the existing pagesStorage
        # convenience behaviour. Prefer IRSA over static keys.
        bucket: ""
        prefix: "pages/"
        region: ""
        endpoint: ""
        accessKeyId: ""
        secretAccessKey: ""
    registry:
      backend: pvc
      size: 20Gi
      # ReadWriteMany (EFS/NFS/CephFS) is REQUIRED for replicas > 1.
      accessMode: ReadWriteOnce
      storageClassName: ""
    npm:
      backend: pvc
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClassName: ""
    artifacts:
      backend: pvc
      size: 50Gi
      accessMode: ReadWriteOnce
      storageClassName: ""
    gitWorkspaces:
      backend: pvc
      size: 50Gi
      accessMode: ReadWriteOnce
      storageClassName: ""
      # s3.* here drives repoStorage cold-tier when backend=s3; the local
      # PVC above always stays as the hot cache.
      s3:
        bucket: ""
        prefix: "repos/"
        region: "eu-central-1"
        endpoint: ""
        accessKeyId: ""
        secretAccessKey: ""
    workspaces:
      backend: emptyDir

# -- Repo storage backend (T1-9). `local` keeps every git repo on
# the PVC at /data/repos — fine for ~10k repos. `s3` enables a cold
# tier on object storage so idle repos can be archived off the
# SSD. The local PVC stays as the hot cache; ensure_local() faults
# repos back in on access.
#
# Hetzner: use Object Storage (S3-compatible). MinIO works locally.
repoStorage:
  kind: local
  s3:
    bucket: ""
    prefix: "repos/"
    region: "eu-central-1"
    # Override only when using a non-AWS S3 backend (Hetzner Object
    # Storage, Cloudflare R2, MinIO).
    endpoint: ""
    # Static credentials. Prefer leaving these empty and using IRSA
    # (AWS) / a workload identity binding (GCP) / a mounted
    # service account (Hetzner) so credentials don't sit in env.
    accessKeyId: ""
    secretAccessKey: ""

# -- Pages asset storage backend (MVP-demo v6 Bug 2 unblock).
# `fs` (default) writes the built static site to the local pod's
# `/data/pages` PVC — fine for single-replica deploys, BUT with 2+
# replicas only the pod that ran deploy_pages can serve the assets
# (50% 404 race per request). `s3` puts each file on object storage
# so every replica reads identical bytes.
#
# When `kind: s3`, leaving s3.* fields empty falls back to the matching
# `repoStorage.s3.*` field — convenient when both stores live in the
# same bucket with different prefixes.
pagesStorage:
  kind: fs
  s3:
    bucket: ""
    prefix: "pages/"
    region: "eu-central-1"
    endpoint: ""
    accessKeyId: ""
    secretAccessKey: ""

# -- Ingress
#
# Controller-agnostic: drive className + annotations from values so the
# same chart renders correctly for AWS Load Balancer Controller (ALB),
# ingress-nginx + cert-manager, or any other ingress class.
#
# `tls` accepts either:
#   true              → templated to one entry { hosts: [domain],
#                       secretName: <release>-nucel-server-tls } (or the
#                       value of .Values.ingress.tlsSecretName if set)
#   false             → no tls block
#   [ ... ]           → raw list passed through verbatim (multi-host SNI)
ingress:
  enabled: false
  className: ""
  annotations: {}
  tls: true
  tlsSecretName: ""
  # --- AWS Load Balancer Controller (ALB) — EKS ---
  # className: alb
  # annotations:
  #   alb.ingress.kubernetes.io/scheme: internet-facing
  #   alb.ingress.kubernetes.io/target-type: ip
  #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  #   alb.ingress.kubernetes.io/ssl-redirect: '443'
  #   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:region:account:certificate/uuid
  #   alb.ingress.kubernetes.io/healthcheck-path: /healthz
  # tls: false  # ALB terminates via ACM, no in-cluster TLS secret
  #
  # --- ingress-nginx + cert-manager ---
  # className: nginx
  # annotations:
  #   nginx.ingress.kubernetes.io/proxy-body-size: 100m
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  # tls: true

# -- ServiceAccount
#
# `create: true` provisions a SA named after the release; set `name` to
# bind to an externally-managed SA instead. `annotations` is the IRSA
# (IAM Roles for Service Accounts) wiring point on EKS: stamping
# `eks.amazonaws.com/role-arn` here lets the server's S3 repo backend
# authenticate via the pod's projected service-account token instead of
# the static `repoStorage.s3.accessKeyId` / `secretAccessKey` pair —
# preferred for any production EKS deployment.
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # --- IRSA (IAM Roles for Service Accounts) — EKS ---
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/nucel-server-irsa-role
  #
  # --- GKE Workload Identity ---
  # annotations:
  #   iam.gke.io/gcp-service-account: nucel-server@PROJECT.iam.gserviceaccount.com

# -- Secrets (set create: false to manage externally — e.g. when
# externalSecrets.enabled=true and an ExternalSecret CRD writes the
# Secret object instead).
secrets:
  create: true
  # When true, fail `helm install/upgrade` if any of the secrets that
  # MUST be set in production are empty. Currently enforces:
  #   - oidcPrivateKey  (Fix C8 — auth across pod restarts)
  # The SSH host key (Fix C9) and the metrics token (Fix H9) are gated
  # by their own flags below so each can be relaxed independently for
  # local dev / single-replica overlays.
  requireProductionValues: true
  dbUser: root
  dbPass: ""
  ciRunnerToken: ""
  hookSecret: ""
  # Ed25519 private key (PKCS#8 PEM) used to sign OIDC ID tokens. When
  # unset, each pod boots with an ephemeral key and tokens issued by
  # one pod are rejected by every other pod / by the same pod after a
  # restart. Generate once with:
  #   openssl genpkey -algorithm ED25519
  #
  # Fix C8: enforced via the Helm `required` template function when
  # `secrets.create: true` AND `secrets.requireProductionValues: true`.
  # Set `requireProductionValues: false` to relax for local dev /
  # ephemeral preview environments.
  oidcPrivateKey: ""
  # B-15 -- session cookie signing key shared across every nucel-server
  # replica. Hex-encoded (>= 128 hex chars = 64 raw bytes) OR any ASCII
  # / byte string >= 64 bytes. Generate with:
  #   openssl rand -hex 64
  #
  # Without this set, each pod signs `nucel_session` cookies with its
  # own ephemeral key and any request routed to a sibling pod by the
  # load balancer fails signature verification, logging the user out.
  #
  # When `secrets.requireProductionValues=true` this is required at
  # install time. Otherwise the chart generates one on first install
  # via `randAlphaNum 64` and reuses it on every upgrade via a `lookup`
  # of the existing Secret (so rotation is intentional, not accidental
  # -- rotating invalidates every active session).
  sessionKey: ""
  # Ed25519 private key (OpenSSH or PKCS#8 PEM) used as the SSH server's
  # host key.
  #
  # Auto-generation (added Wave neoconto cluster audit):
  #   When this value is empty, the chart auto-generates a fresh Ed25519
  #   key on first install (via Helm's `genPrivateKey "ed25519"`, PKCS#8
  #   PEM) and carries it forward verbatim on every subsequent upgrade
  #   via `lookup`. The russh-keys crate accepts both OpenSSH and PKCS#8
  #   PEM Ed25519 keys, so the auto-generated key works without any
  #   format conversion.
  #
  #   This eliminates the "SSH server failed to start: No such file or
  #   directory" warning on fresh installs without requiring operators
  #   to pre-generate a host key out of band.
  #
  # Operator-supplied (still preferred for installs that rotate the
  # host key out-of-band):
  #   ssh-keygen -t ed25519 -N "" -f nucel-ssh-host -C "nucel-ssh-host"
  #   cat nucel-ssh-host    # OpenSSH PEM — paste into this field
  #
  # Fix C9: chart mounts the key into the server pod at
  # /etc/nucel/ssh-host-key and points `NUCEL_SSH_HOST_KEY_PATH` at it
  # (the server reads the host key from a file via that env var — see
  # crates/nucel-server/src/ssh/mod.rs::load_or_generate_host_key).
  sshHostKey: ""
  # AES-256-GCM master key for encrypting BYOK API keys and CI/org secrets
  # (`NUCEL_SECRET_ENCRYPTION_KEY`). Format: 64 hex chars = openssl rand -hex 32.
  # H-7: auto-generated on first install; carried forward via `lookup` on upgrades.
  # When `secrets.requireProductionValues=true` this field is required.
  secretEncryptionKey: ""
  # Bearer token Prometheus must send as `Authorization: Bearer <token>`
  # to scrape /metrics. When unset the endpoint serves anonymously
  # (typical for local dev). In any environment where /metrics is
  # reachable from outside the cluster this MUST be set.
  #
  # Fix H9: enforced via `required` when `prometheus.requireAuth: true`
  # (default). The /metrics endpoint shares its listener with the rest
  # of the application — anything reachable on the ingress reaches
  # /metrics too unless this is set.
  metricsToken: ""
  # OpenRouter API key for the agent-workflow threat scanner (Wave 4).
  # Without this set, the scanner runs in offline-mode (always returns
  # `pass`). Production deployments MUST set this so workflow output
  # actually gets scanned for prompt-injection / leaked-secrets /
  # malicious-code before being applied.
  openrouterKey: ""
  # Bot account credentials for agent-workflow PAT minting (NUCEL_GIT_USER /
  # NUCEL_GIT_PASSWORD). The server signs in as this user and mints a fresh
  # per-run scoped PAT for each AW dispatch. Without these set,
  # mint_scoped_pat returns None and AW K8s dispatch is skipped.
  # The bot user must exist in the database with a valid account.
  gitBotUser: ""
  gitBotPassword: ""
  # Anthropic API key for agent-workflow runner pods (claude-code SDK).
  # When set, the chart also mirrors this into a second Secret
  # `nucel-aw-anthropic` in `.Values.ciNamespace` (defaults to `nucel-ci`)
  # so runner Jobs spawned by `aw_k8s_dispatch` can mount it via
  # `secretKeyRef` (see `agentWorkflows.k8s.anthropicSecret`). Without it,
  # AW runner pods boot without ANTHROPIC_API_KEY and the agent SDK calls
  # fail at runtime.
  #
  # In production, prefer wiring this through `externalSecrets` so the key
  # is pulled from AWS Secrets Manager / Vault — leaving it in chart
  # values risks accidental commit.
  #
  # WARNING: do NOT commit a real key into values.yaml. Use --set / overlay
  # files / ExternalSecrets.
  anthropicApiKey: ""

# -- Pre-launch HTTP Basic auth gate for the WHOLE app (the neoconto alpha
# is unpublished). When `basicAuth.enabled: true`, the chart wires
# `NUCEL_BASIC_AUTH=<user>:<password>` into the server Deployment from a
# Secret, and the outermost tower middleware in `nucel_server::basic_auth`
# 401s every request lacking a matching `Authorization: Basic` header
# (health/metrics paths + kube-probe/ELB-HealthChecker UAs bypass it so
# probes stay green). Off by default — flip on only for staging/alpha
# overlays (e.g. neoconto). When disabled, NUCEL_BASIC_AUTH is never set
# and the gate is transparent.
basicAuth:
  enabled: false
  user: "nucel"
  # Leave blank in values.yaml; pass via `--set basicAuth.password=...`
  # so it never lands in git. Ignored when `existingSecret` is set.
  password: ""
  # Manage the credential out-of-band: set `existingSecret` to the name of
  # a Secret in the server namespace holding key `NUCEL_BASIC_AUTH` with
  # value `user:pass`. The chart then skips rendering its own Secret and
  # wires the env straight from this one. Matches the marketing site's
  # existing `nucel-web-basic-auth` shape (rename the key to
  # NUCEL_BASIC_AUTH, or create a dedicated `nucel-basic-auth` Secret).
  existingSecret: ""

# -- External Secrets Operator (https://external-secrets.io) integration.
#
# When `externalSecrets.enabled: true` the chart renders an
# `ExternalSecret` CRD that pulls the chart's Secret object from a remote
# secrets backend (AWS Secrets Manager, GCP Secret Manager, Vault, …)
# instead of materialising it from chart values. Set
# `secrets.create: false` at the same time so the chart-managed Secret
# template is skipped — otherwise both will fight to own the same
# `metadata.name`.
#
# Disabled by default; the chart still renders on clusters that don't
# run the External Secrets Operator (the external-secrets.io CRD
# wouldn't exist there and `helm install` would reject the manifest).
#
# Typical EKS overlay:
#   externalSecrets:
#     enabled: true
#     secretStoreRef:
#       name: aws-secrets-manager
#       kind: ClusterSecretStore
#     remoteRef:
#       key: nucel/prod/server
#   secrets:
#     create: false
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    # ClusterSecretStore (cluster-scoped) or SecretStore (namespace-scoped).
    kind: ClusterSecretStore
  remoteRef:
    # Single-blob shape: one remote key whose JSON payload contains every
    # NUCEL_* the chart expects in the Secret (NUCEL_DB_PASS,
    # NUCEL_OIDC_PRIVATE_KEY, NUCEL_SSH_HOST_KEY, NUCEL_METRICS_TOKEN,
    # NUCEL_HOOK_SECRET, NUCEL_CI_RUNNER_TOKEN, NUCEL_OPENROUTER_KEY, …).
    # Rendered as ExternalSecret `dataFrom.extract`.
    key: ""
  # Per-key shape (alternative to remoteRef.key above): a map of
  # <chartKey>: <remotePath>, one remote secret per logical value. Each
  # entry renders as an ExternalSecret `data[]` item mapping the NUCEL_*
  # env key to its remote path. This is what values-production.yaml uses.
  # At least one of remoteRef.key / remoteRefs must be set when
  # externalSecrets.enabled=true (the template fails fast otherwise).
  # Valid chartKeys: dbPass, oidcPrivateKey, sessionKey, sshHostKey,
  # metricsToken, hookSecret, ciRunnerToken, openrouterKey,
  # anthropicApiKey, gitBotUser, gitBotPassword, s3AccessKeyId,
  # s3SecretAccessKey, dbUser.
  remoteRefs: {}
  #  oidcPrivateKey: nucel/prod/oidc-private-key
  #  metricsToken:   nucel/prod/metrics-token

# -- Agent-workflow scheduler tick (Wave 7b/7c) cadence in seconds.
# The in-process scheduler enqueues an aw_tick job every N seconds;
# the handler walks autoloop + cron-scheduled workflows and dispatches
# matched runs. Default 300 (5 min) — suitable for cron expressions
# down to */5 minute granularity. Lower it if you have * * * * *
# expressions and need them to fire promptly.
agentWorkflows:
  # K8s dispatch (NUCEL_AW_K8S_URL must be set to enable AW runner pods).
  # In production the pod uses its mounted ServiceAccount token for K8s
  # auth so NUCEL_AW_K8S_TOKEN is not required here — the chart omits it
  # and aw_k8s_dispatch.rs reads the in-cluster token file automatically.
  #
  # Set k8s.url = "https://kubernetes.default.svc" to enable in-cluster
  # AW dispatch. Leave blank to disable (dev mode / no runner pods).
  k8s:
    url: ""
    # namespace: K8s namespace where AW runner Jobs + per-run Secrets are
    # created. Must match the namespace that holds nucel-aw-anthropic Secret.
    namespace: "nucel-ci"
    # apiUrl: the base URL the runner pod uses to call back to nucel-server.
    # Defaults to the in-cluster service address; override when the server
    # is not reachable via the default cluster-local DNS name.
    apiUrl: ""
    # runnerImage: OCI image reference for the nucel-aw-runner binary.
    # Required when k8s.url is set; leave empty to disable runner pod creation.
    runnerImage: ""
    # anthropicSecret: name of the K8s Secret in k8s.namespace that holds
    # ANTHROPIC_API_KEY. Injected into the runner pod via secretKeyRef
    # with optional:true. Defaults to "nucel-aw-anthropic".
    anthropicSecret: "nucel-aw-anthropic"
  tickPeriodSeconds: 300
  # Wave M: per-workflow manual-trigger cap (per minute). Drain
  # protection against a misbehaving operator hammering the
  # "Trigger now" button. Counts nucel_workflow_run rows with
  # trigger_type='manual' for THIS workflow over the last 60s.
  # Hitting the cap returns 429 with retry_after_seconds=60.
  manualTriggerPerMin: 5
  # Wave M2: org-wide manual-trigger cap (per minute). Counts manual
  # runs across ALL workflows owned by the same org. Closes the
  # loophole of spamming distinct workflows to bypass the per-workflow
  # cap above. Default 20.
  orgManualTriggerPerMin: 20
  # Wave Q: org-wide daily spend ceiling (USD). When the sum of
  # agent_session.cost_usd over the past 24h for the workflow's
  # owning org meets-or-exceeds this cap, the run is marked
  # 'budget_exceeded' and dispatch is skipped — runner pod never
  # starts. 0 disables the gate (default).
  dailyOrgUsdCap: 0
  # Wave J: needs_review TTL (hours). aw_tick auto-rejects any run
  # stuck in 'needs_review' longer than this. Default 168 = 7 days.
  # Set to 0 to disable.
  needsReviewTtlHours: 168
  # Wave X: stuck-runner timeout (minutes). aw_tick auto-fails any
  # run sitting in running/scanning/applying past this — covers the
  # case where the runner pod OOMed or got evicted mid-execution and
  # the lifecycle callback never came back. Default 60. Set to 0 to
  # disable.
  runStuckTimeoutMin: 60
  # Wave AO: circuit breaker. After this many consecutive
  # failed/blocked runs in a row, aw_tick auto-disables the
  # workflow with an audit row so a broken workflow doesn't keep
  # burning budget. 0 (default) disables the breaker.
  autoDisableAfterNFails: 0
  # Wave AY: env-controlled org-wide concurrency cap. Caps the
  # number of in-flight runs (any non-terminal status) across ALL
  # workflows owned by the same org. Closes the loophole where N
  # workflows in feedback can saturate the runner pool. 0 disables
  # (default).
  orgMaxConcurrent: 0

# -- NodePool (custom Karpenter NodePool — survives EKS Auto Mode
# reconciliation, unlike patches to the managed general-purpose pool)
nodePool:
  create: true
  name: arm64-general
  limits:
    cpu: "100"
    memory: "200Gi"

# -- Namespace
namespace:
  create: true
  name: nucel

# -- CI namespace (for PipelineJobRun CRDs)
ciNamespace: nucel-ci

# -- CI Operator (set enabled: true to deploy runner secret)
ciOperator:
  enabled: true
  runnerToken: ""

# -- Fake-data seeder (`nucel-seed` binary baked into the same image
# as nucel-server). Off by default — flip `seed.enabled: true` to
# run it. Each helm upgrade with the flag set creates a fresh Job;
# the `helm.sh/hook-delete-policy: before-hook-creation` annotation
# replaces any prior run so re-running is idempotent at the K8s
# level (the seed itself appends new fake rows on top of existing
# data).
#
# Scale presets (number of fake rows generated):
#   small   →     100 users  / ~10K rows total
#   medium  →    5000 users  / ~500K rows  (default)
#   large   →   50000 users  / ~5M rows
#   huge    →  500000 users  / ~50M rows
#
# Run with:
#   helm upgrade nucel ./charts/nucel-server \
#     --set seed.enabled=true --set seed.scale=huge
#
# When asHook=true, the Job runs as a post-install/post-upgrade
# hook (helm waits for completion before reporting the release as
# ready). When false, it's a regular Job applied alongside the rest
# of the release (helm doesn't wait — useful for huge scales that
# would blow past the helm timeout).
seed:
  enabled: false
  # Run mode for the seed Job:
  #   seed   →  default. Drops FULLTEXT, runs the 9-step pipeline,
  #             rebuilds FULLTEXT.
  #   reset  →  wipes all seeded tables (DELETE leaves-first) then
  #             rebuilds FULLTEXT against the empty tables. Use to
  #             recover from a failed seed run that left orphan rows
  #             + missing indexes.
  runMode: seed
  # When true, mount the `nucel-repos` PVC at /data/repos so step_02
  # can create real bare git repos with seed commits. Adds a hard
  # podAffinity rule pinning the seed pod to a node where a server
  # replica is already running (RWO PVC requirement). Disable when
  # the cluster doesn't run nucel-server, or when you only want DB
  # rows without backing git data.
  mountRepos: false
  # Preset profile: small | medium | large | huge.
  # Individual fields below override the preset's row counts when set.
  scale: medium
  # Per-table row-count overrides. Empty = use the preset's value.
  # These map 1:1 to NUCEL_SEED_* env vars consumed by nucel-seed.
  overrides:
    users: ""
    orgs: ""
    reposPerOrg: ""
    missionsPerRepo: ""
    pullsPerRepo: ""
    commentsPerMission: ""
    commentsPerPull: ""
    wikiPerRepo: ""
    agentsPerOrg: ""
  # When true the Job runs as a post-install/post-upgrade hook —
  # helm waits for completion. False = plain Job (helm does not
  # wait; recommended for `huge` scale which can take >10 min and
  # would exceed the default helm --timeout).
  asHook: false
  # Run modes:
  #   Once     → single Job, runs to completion, gets cleaned up
  #              after ttlSecondsAfterFinished
  #   OnDemand → same but the Job's name includes .Release.Revision
  #              so each `helm upgrade` makes a fresh Job (lets you
  #              re-seed without first deleting the prior Job)
  mode: OnDemand
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  # Hard ceiling on Job runtime. `huge` at 50M rows on a single
  # 4-CPU pod takes ~30-60 min depending on SurrealDB I/O — give it
  # 2h headroom by default.
  activeDeadlineSeconds: 7200
  # Override the seed image when it's not the same as the server
  # image (e.g. running the seed off a fork without redeploying).
  # Empty = inherit from .Values.image.
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    # Memory limit doubled from the original 8Gi default — even with
    # the streaming BatchInserter the in-flight ID lookup tables (org,
    # user, repo IDs) plus SurrealDB driver buffers can exceed 8Gi at
    # huge scale (500K users + 100K repos + 3M missions worth of
    # foreign-key id strings). 16Gi is comfortable headroom.
    limits:
      cpu: "4"
      memory: "16Gi"
  # Pin to arm64 by default since the cluster's general-purpose pool
  # is arm64-only. Override for x86 clusters.
  nodeSelector:
    kubernetes.io/arch: arm64
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  # Extra raw env vars passed through to the seed container. Use
  # for one-off knobs (e.g. RUST_LOG=debug) without rebuilding the
  # chart.
  extraEnv: []
  #   - name: RUST_LOG
  #     value: debug

# -- Logging
logging:
  level: info
  rustLog: "info,nucel_server=info,tower_http=warn"

# -- Prometheus integration. Requires kube-prometheus-stack
# (or any Prometheus operator) running in the cluster. Two
# sub-resources, both opt-in:
#
#  - `alerts` ships PrometheusRule CRDs (queue depth, DLQ, latency,
#    fatal rate). Existed before Fix H4.
#  - `serviceMonitor` ships a ServiceMonitor CRD so Prometheus
#    auto-discovers and scrapes the server's /metrics endpoint
#    on the `http` port. Without this the alert rules above
#    evaluate against an empty time-series.
#
# `requireAuth: true` (default) makes the chart fail-fast if
# `secrets.metricsToken` is empty (Fix H9). The /metrics endpoint shares
# the same Axum listener as the rest of the API, so anything reachable
# on the ingress reaches /metrics — leaving the token empty exposes
# bg_job kinds, dispatch counters and latency histograms to anyone who
# can hit the ingress. Set `requireAuth: false` only in fully
# air-gapped local-dev / preview overlays.
prometheus:
  requireAuth: true
  alerts:
    enabled: false
    # Extra labels on the rule resource — useful when your operator
    # routes alerts via labels (`{{ team: platform }}` etc.).
    labels: {}
    # Pending rows allowed per kind before alerting.
    pendingDepthThreshold: 1000
    # Claim p99 latency budget (seconds).
    claimLatencyP99: 0.5
    # Per-kind fatal/panic dispatch rate (per second) before alerting.
    fatalRate: 1

  # ServiceMonitor for Prometheus Operator-based discovery of the
  # server's /metrics endpoint (Fix H4). Off by default so the chart
  # still renders on clusters that DON'T run the Prometheus Operator
  # (the monitoring.coreos.com/v1 CRD wouldn't exist there). Turn this
  # on in any environment that runs kube-prometheus-stack.
  serviceMonitor:
    enabled: false
    # Scrape cadence. 30s matches kube-prometheus-stack's default for
    # cluster-internal targets.
    interval: 30s
    # Per-scrape timeout; must be < interval.
    scrapeTimeout: 10s
    # Extra labels on the ServiceMonitor itself. Most kube-prometheus-
    # stack installs require `release: kube-prometheus-stack` so the
    # Prometheus CR's `serviceMonitorSelector` picks it up — your
    # selector label will vary by install.
    #   labels:
    #     release: kube-prometheus-stack
    labels: {}
    # Optional relabel config applied BEFORE the scrape — useful for
    # dropping high-cardinality target labels.
    relabelings: []
    # Optional relabel config applied AFTER the scrape — useful for
    # dropping metrics families you don't want shipped to remote_write.
    metricRelabelings: []
    # NOTE: the nucel-ci-operator runs in a separate repo and ships its
    # own manifests; its ServiceMonitor lives there (Fix H3 added the
    # operator's /metrics endpoint + Service). See
    # PRODUCTION_HARDENING.md for the follow-up.

# -- HorizontalPodAutoscaler for the main nucel-server Deployment (Fix H1).
#
# Off by default so single-node / homelab installs keep the simple
# fixed-replica behaviour from `server.replicas`. When enabled, the HPA
# takes over replica count — `server.replicas` becomes the floor only
# at first install (HPA writes its own scale subresource after that).
#
# CPU + memory targets only; queue-depth driven scaling
# (nucel_bg_job_depth) needs prometheus-adapter wiring and is documented
# as a follow-up in PRODUCTION_HARDENING.md rather than shipped here.
autoscaling:
  enabled: false
  # Legacy block — kept in sync with the canonical `hpa.*` block below so
  # operators on either path get the same scale-out targets. New installs
  # should prefer `hpa.*`. See `hpa.*` for the rationale behind each value.
  minReplicas: 3
  maxReplicas: 30
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 75
  # behavior: optional autoscaling/v2 behavior block (stabilization
  # windows, scaling policies). Empty = controller defaults.
  behavior: {}

# -- PodDisruptionBudget for the main nucel-server Deployment (Fix H2).
#
# On by default; `minAvailable: 1` keeps at least one server pod up
# during voluntary disruptions (node drain, cluster upgrade, Karpenter
# consolidation). Pair with `server.replicas >= 2` (or
# `autoscaling.enabled: true`) — with a single replica the PDB will
# block drains entirely.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # Set maxUnavailable instead of minAvailable by leaving minAvailable
  # null and setting this. Only one of the two may be set.
  maxUnavailable: null

# ---------------------------------------------------------------------------
# Scale hardening (scaling primitives for many-user workloads).
#
# These blocks add explicit knobs for the scale-out story. The legacy
# `autoscaling.*` and `podDisruptionBudget.*` keys above keep working
# for backwards compat — the templates fall through to them when the
# new `hpa.*` / `pdb.*` blocks are left at defaults.
# ---------------------------------------------------------------------------

# -- HorizontalPodAutoscaler knobs (scale-hardening).
#
# Off by default so single-replica / homelab installs keep the simple
# fixed-replica behaviour. When enabled, the HPA takes over replica
# count from `server.replicas` after the first install.
#
# `behavior` controls the scale-up / scale-down cooldown windows. When
# left empty the template ships sane production defaults:
#   - scaleUp:   60s stabilization, +100% or +4 pods per 30s
#   - scaleDown: 300s stabilization, -50% or -2 pods per 60s
# Override `behavior` to a non-empty map to take full control of the
# autoscaling/v2 behavior block.
hpa:
  enabled: false
  # Floor raised 2 → 3: with PDB minAvailable:1 and topology spread
  # across (up to) 3 nodes/zones, a 3-replica floor means a single node
  # or zone loss still leaves 2 pods serving while the HPA backfills.
  minReplicas: 3
  # Ceiling raised 10 → 30 for the "a lot more users" target. Each pod is
  # capped at 1 CPU / 1Gi (server.resources.limits), so 30 replicas is
  # ~30 vCPU / ~30Gi of server capacity — comfortably inside the
  # arm64-general NodePool limit (100 CPU / 200Gi). Bump again only after
  # confirming the SurrealDB/TiKV tier and the bg_job runner keep up
  # (watch nucel_bg_job_claim_latency p99 + queue depth on the dashboard).
  maxReplicas: 30
  # CPU target lowered 70 → 60. nucel-server has bursty request handlers
  # (argon2 on signup, libgit2 upload-pack, registry blob streaming) that
  # spike a pod's CPU fast; scaling out at 60% average leaves headroom to
  # absorb the spike during the ~60s it takes a new pod to become ready,
  # rather than saturating at 70% and tail-latency-ing the in-flight
  # requests.
  targetCPUUtilizationPercentage: 60
  # Memory target held at 75. The Rust server's RSS is fairly flat
  # (no large per-request allocations on the steady-state read paths),
  # so memory is a guard-rail rather than the primary scaling signal —
  # CPU drives scale-out first in practice.
  targetMemoryUtilizationPercentage: 75
  # behavior left at the template defaults (snappy 60s scale-up / cautious
  # 300s scale-down). The +100%/+4-pods-per-30s scale-up policy matters
  # more now that maxReplicas is 30: a traffic spike can double the fleet
  # every 30s instead of crawling up one pod at a time.
  behavior: {}

# -- PodDisruptionBudget knobs (scale-hardening).
#
# On by default with `minAvailable: 1` so voluntary disruptions (node
# drain, cluster upgrade, Karpenter consolidation) can't take the
# service fully down. Pair with `server.replicas >= 2` OR
# `hpa.enabled: true` (which defaults to `minReplicas: 2`) — otherwise
# the PDB will block drains entirely.
pdb:
  enabled: true
  minAvailable: 1
  # Set maxUnavailable instead of minAvailable by leaving minAvailable
  # null and setting this. Only one of the two may be set.
  maxUnavailable: null

# -- Optional cluster-scoped PriorityClass resources for nucel pods.
#
# Off by default because PriorityClass is cluster-scoped and can
# collide across installs in multi-tenant clusters. Enable when you
# want strict eviction ordering for nucel workloads during node
# pressure (and set `server.priorityClassName: nucel-system` etc. on
# the per-component blocks above).
priorityClass:
  create: false
  system:
    enabled: true
    name: nucel-system
    value: 1000000
    preemptionPolicy: PreemptLowerPriority
    description: "High-priority class for nucel control-plane pods (nucel-server)."
  workload:
    enabled: true
    name: nucel-workload
    value: 100000
    preemptionPolicy: PreemptLowerPriority
    description: "Medium-priority class for nucel background workloads (workers, seed jobs)."

# -- Default resource requests / limits applied to the main server
# Deployment when `server.resources` is left at its defaults.
#
# These mirror the recommended starting point for production:
#   requests: 250m CPU / 512Mi memory
#   limits:   1    CPU / 1Gi    memory
#
# The chart's deployment.yaml already wires `.Values.server.resources`
# into the container spec; override the `server.resources` block above
# to pick these values up across all server pods.
resourcesDefaults:
  server:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- Pod topology spread constraints for the main server Deployment.
#
# Spreads pods across nodes and (when running on a multi-zone cluster)
# zones so a single node or zone failure doesn't take a disproportionate
# share of capacity down. Leave the list empty to opt out.
#
# These are wired through `server.topologySpreadConstraints` (the chart
# templates pick the value up automatically when present); set
# `server.topologySpreadConstraints: []` to disable.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: nucel
        app.kubernetes.io/component: server
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: nucel
        app.kubernetes.io/component: server

# -- Default affinity for the main server Deployment.
#
# Preferred (soft) pod anti-affinity on hostname — the scheduler will
# try to spread server replicas across different nodes, but won't block
# scheduling when only one node is available (e.g. single-node clusters,
# rolling node replacement). Pair with `topologySpreadConstraints` for
# a belt-and-braces spread strategy.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nucel
              app.kubernetes.io/component: server

# -- Default priorityClassName for the main server Deployment.
#
# Empty by default. Set to "nucel-system" (or whatever name you
# configured under `priorityClass.system.name`) after enabling
# `priorityClass.create: true`.
priorityClassName: ""

# ────────────────────────────────────────────────────────────────────────────
# Metrics — observability launch pack (RPS, latency, pipelines, agent cost).
#
# This block is the user-facing shorthand for the platform-wide
# Prometheus + Grafana story. It does NOT replace `prometheus.*` above
# (which still owns the ServiceMonitor + PrometheusRule templates). The
# two coexist because:
#
#   - `prometheus.serviceMonitor` predates this block and is what
#     production overlays already set; renaming it would be a breaking
#     value-schema change for existing installs.
#   - `metrics.*` mirrors the same flags under a friendlier name and
#     documents the on-by-default launch defaults. Helm templates read
#     either one (see chart README / PRODUCTION_HARDENING.md).
#
# The Rust server itself always emits Prometheus metrics — `enabled`
# below is about the *kubernetes wiring* (ServiceMonitor, scrape, etc.),
# not the `/metrics` handler.
metrics:
  # Master switch. Off keeps the chart inert (no ServiceMonitor, no
  # documentation hints); on is the recommended launch config.
  enabled: true
  # When true, mounts /metrics on the public Service path so anything
  # that can reach the ingress can hit it. Default false: scrape via
  # the in-cluster Service only. Pair with `secrets.metricsToken` to
  # enforce bearer auth if you flip this on.
  publicEndpoint: false
  serviceMonitor:
    # Mirrors `prometheus.serviceMonitor.enabled`. The actual CRD is
    # rendered from `templates/servicemonitor.yaml`, which reads the
    # `prometheus.*` keys today — operators flipping THIS flag should
    # also set `prometheus.serviceMonitor.enabled=true`. A follow-up
    # commit will unify both under `metrics.*` once existing overlays
    # are migrated.
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  # Grafana dashboard ConfigMap (templates/grafana-dashboard.yaml).
  #
  # When enabled, the chart ships a ConfigMap holding the
  # `dashboards/nucel-server-overview.json` dashboard, labelled for
  # auto-discovery by the kube-prometheus-stack Grafana sidecar. It is
  # ADDITIVE — it does not touch any hand-built dashboards. Off by
  # default so the chart still renders on clusters without a Grafana
  # sidecar (a plain ConfigMap is harmless there, but we keep the launch
  # surface opt-in for parity with the other metrics.* toggles).
  grafanaDashboard:
    enabled: false
    # Label the Grafana sidecar selects on. kube-prometheus-stack's
    # default is `grafana_dashboard`. Override if your sidecar uses a
    # custom LABEL (e.g. `grafana_dashboard: enabled`).
    sidecarLabel: grafana_dashboard
    # Grafana folder the dashboard is filed under (sidecar
    # FOLDER_ANNOTATION). Empty falls back to "Nucel".
    folder: "Nucel"
    # Extra labels on the dashboard ConfigMap.
    labels: {}

  # -- Production SLO + health alerts (templates/prometheusrule.yaml).
  #
  # This is the platform-wide alerting layer — RED signals, SLO-breach
  # alerts, dependency health, and the k8s failure modes that should
  # page or ticket an operator. It is SEPARATE from (and additive to)
  # `prometheus.alerts.*`, which keeps the original bg_job-only
  # PrometheusRule for back-compat with existing overlays.
  #
  # Off by default: rendering a PrometheusRule requires the Prometheus
  # Operator CRD (`monitoring.coreos.com/v1`), which only exists where
  # kube-prometheus-stack is installed. Turn this on in any environment
  # running the operator, alongside `metrics.serviceMonitor.enabled`
  # (the rules evaluate against an empty time-series without a scrape).
  #
  # Severity → routing convention (see docs/runbooks/slos.md):
  #   severity: critical  → page (PagerDuty / on-call)
  #   severity: warning   → ticket (Slack / issue tracker)
  alerts:
    enabled: false
    # Extra labels on the PrometheusRule resource — useful when your
    # operator's `ruleSelector` matches on a label
    # (e.g. `release: kube-prometheus-stack`) or for alert routing.
    #   labels:
    #     release: kube-prometheus-stack
    labels: {}

    # All alert thresholds live here so operators tune the noise floor
    # per environment without editing the template. Defaults track the
    # load/PLAN_1M.md §4 SLO numbers.
    thresholds:
      # HTTP — fraction of all responses that are 5xx before paging.
      http5xxRatio: 0.01
      # Global availability SLO target + multi-window burn-rate factor
      # for the fast-burn page (14.4x of a 30-day budget ≈ exhausted in
      # ~2 days). target 0.999 = 99.9% availability.
      availabilityTarget: 0.999
      availabilityBudgetBurn: 14.4
      # Web/API p99 latency SLO (seconds). PLAN_1M §4 web-browse p99.
      webP99Seconds: 1.5
      # bg_job: pending rows per kind before a depth alert; the
      # "queue non-empty but stalled" floor; claim p99 budget (s).
      bgJobPendingDepth: 5000
      bgJobStallDepth: 100
      bgJobClaimP99Seconds: 0.5
      # SurrealDB query p99 budget (seconds).
      dbQueryP99Seconds: 0.5
      # SSE leak guard (#281): floor above which a monotonically-rising
      # open-connection count is treated as a leak.
      sseLeakFloor: 500
      # Registry blob op p99 budget (seconds) — CI image-pull hot path.
      registryBlobP99Seconds: 10
      # Platform: restarts-in-15min that count as crash-looping; PVC
      # used/capacity ratio that counts as near-full.
      crashLoopRestarts: 3
      pvcUsedRatio: 0.85

    # TLS cert-expiry alert. OFF by default — only fires where
    # cert-manager is scraped (it exports
    # `certmanager_certificate_expiration_timestamp_seconds`). Installs
    # that terminate TLS at the ALB via ACM don't have this metric.
    certExpiry:
      enabled: false
      warnDays: 14

    # Backup-freshness alert. OFF by default — coordinates with the
    # DocumentDB/SurrealDB backup work, which must export a
    # "last successful backup" unix-timestamp gauge. Configure the
    # metric name the backup pipeline emits and the staleness budget.
    backup:
      enabled: false
      metricName: "nucel_backup_last_success_timestamp_seconds"
      maxAgeHours: 26

    # -- Alertmanager routing reference (NOT rendered by this chart).
    #
    # The chart deliberately does NOT template an Alertmanager config —
    # Alertmanager is cluster-wide (one per kube-prometheus-stack
    # release) and owning it from an app chart would clobber other
    # teams' routes. This block is a documented, copy-paste reference for
    # the `alertmanager.config` of your kube-prometheus-stack values.
    # Webhooks / keys are placeholders — supply them via your own Secret
    # (e.g. `alertmanager.alertmanagerSpec.secrets`), never hardcoded.
    #
    # Severity → channel mapping matches the convention above:
    #   critical → page (PagerDuty)   warning → ticket (Slack)
    #
    #   alertmanagerRouting:
    #     route:
    #       group_by: ["alertname", "namespace"]
    #       receiver: nucel-slack-tickets   # default = ticket
    #       routes:
    #         - matchers: ['severity = "critical"']
    #           receiver: nucel-pagerduty
    #           continue: true
    #         - matchers: ['severity = "warning"']
    #           receiver: nucel-slack-tickets
    #     receivers:
    #       - name: nucel-pagerduty
    #         pagerduty_configs:
    #           - routing_key_file: /etc/alertmanager/secrets/pagerduty/key
    #             severity: critical
    #       - name: nucel-slack-tickets
    #         slack_configs:
    #           - api_url_file: /etc/alertmanager/secrets/slack/webhook
    #             channel: "#nucel-alerts"
    #             send_resolved: true
    alertmanagerRouting: {}
