# Production overlay — apply on top of values.yaml with:
#
#   helm upgrade nucel-server charts/nucel-server \
#     -f charts/nucel-server/values.yaml \
#     -f charts/nucel-server/values-production.yaml \
#     --set secrets.oidcPrivateKey="$(cat /run/secrets/oidc_key)" \
#     --set secrets.metricsToken="$(cat /run/secrets/metrics_token)"
#
# REQUIRED: set secrets.requireProductionValues=true so required() gates enforce
# that oidcPrivateKey and metricsToken are present before the chart deploys.

secrets:
  requireProductionValues: true

# HPA: scale server replicas 3-30 at 60% CPU / 75% memory (scale push).
# Floor 3 keeps 2 pods serving through a single node/zone loss while the
# HPA backfills; ceiling 30 fits the arm64-general NodePool (100 CPU /
# 200Gi) at the 1 CPU / 1Gi per-pod limit. 60% CPU target scales out
# before the bursty handlers (argon2, upload-pack, registry blobs)
# saturate a pod during the ~60s a new replica takes to become ready.
# See values.yaml `hpa.*` for the full rationale.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 30
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 75

# PDB: tolerate a single unavailable replica during rolling updates.
podDisruptionBudget:
  enabled: true

# Schema migration runs as a pre-upgrade hook Job; server pods skip the
# inline schema apply on startup (prevents races during rolling restarts).
migrations:
  enabled: true

# Pull secrets from AWS Secrets Manager via external-secrets-operator.
externalSecrets:
  enabled: true
  # refreshInterval controls how often ESO polls the backend store.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  # Override per-key remote refs to match your Secrets Manager path convention.
  # Example: oidcPrivateKey lives at `nucel/prod/oidc-private-key`.
  remoteRefs:
    oidcPrivateKey: nucel/prod/oidc-private-key
    metricsToken: nucel/prod/metrics-token
  # Set create: false so the chart's secret template doesn't compete with ESO.
  create: false

surrealdb:
  deploy: false  # managed by modules/surrealdb Terraform; chart does NOT create it

# Enable Prometheus alerting rules (requires kube-prometheus-stack in cluster).
prometheus:
  alerts:
    enabled: true
    # Paste labels matching your Alertmanager routing rules here.
    labels:
      team: platform
    # Production thresholds — lower than defaults to catch problems early.
    pendingDepthThreshold: 500
    claimLatencyP99: 1.0
    fatalRate: 0.5
  serviceMonitor:
    enabled: true

# Ship the Grafana scale/queue overview dashboard (picked up by the
# kube-prometheus-stack Grafana sidecar). Additive — does not touch any
# hand-built dashboards. If your sidecar selects on a non-default label,
# override metrics.grafanaDashboard.sidecarLabel.
metrics:
  enabled: true
  grafanaDashboard:
    enabled: true
    sidecarLabel: grafana_dashboard
    folder: "Nucel"

# ─────────────────────────────────────────────────────────────────────────────
# Multi-replica storage strategy (#236 / #244).
#
# This overlay runs the server multi-replica (autoscaling 3-30 above), so NO
# shared data class may sit on a ReadWriteOnce PVC or emptyDir — both break
# across replicas (Multi-Attach errors / 404 race / data loss on pod cycle).
# The chart's `nucel.storage.validate` guard fails the install if you violate
# this.
#
# Production-recommended config:
#   pages         → s3   (object storage; every replica serves identical bytes)
#   registry      → pvc + ReadWriteMany (EFS)  — binary is FS-only, no S3 yet
#   npm           → pvc + ReadWriteMany (EFS)
#   artifacts     → pvc + ReadWriteMany (EFS)
#   gitWorkspaces → pvc + ReadWriteMany (EFS) hot cache + S3 cold tier
#
# Wire the EFS CSI driver and create a ReadWriteMany StorageClass named `efs`
# (or override storageClassName below). Pages S3 auth uses IRSA — set the
# serviceAccount role-arn below.
storage:
  # EFS sizing is elastic; these requests are nominal (EFS ignores capacity).
  classes:
    pages:
      backend: s3
      s3:
        # Set the bucket (or leave empty to share repoStorage.s3.bucket with
        # the pages/ prefix). Authenticate via IRSA (serviceAccount below).
        bucket: ""
        prefix: "pages/"
        region: "eu-central-1"
    registry:
      backend: pvc
      accessMode: ReadWriteMany
      storageClassName: efs
      size: 20Gi
    npm:
      backend: pvc
      accessMode: ReadWriteMany
      storageClassName: efs
      size: 10Gi
    artifacts:
      backend: pvc
      accessMode: ReadWriteMany
      storageClassName: efs
      size: 50Gi
    gitWorkspaces:
      # Local EFS PVC is the hot cache; S3 is the cold tier (set s3.bucket to
      # enable archival of idle repos). RWX so every replica + the worker
      # share /data/repos.
      backend: s3
      accessMode: ReadWriteMany
      storageClassName: efs
      size: 50Gi
      s3:
        bucket: ""
        prefix: "repos/"
        region: "eu-central-1"

# IRSA: the pages S3 backend authenticates via the pod's projected
# service-account token. Stamp the IAM role ARN that grants s3:* on the
# bucket(s) above. Without this the AWS SDK falls through to IMDS and times
# out (see #273).
serviceAccount:
  create: true
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/nucel-server-irsa-role
