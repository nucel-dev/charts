{{- if and .Values.externalSecrets .Values.externalSecrets.enabled }}
# Fix H6 — External Secrets Operator integration.
#
# Renders an ExternalSecret CRD (external-secrets.io) that pulls the
# chart's Secret object from a remote backend (AWS Secrets Manager,
# GCP Secret Manager, Vault, …) instead of materialising it from chart
# values. Pair with `secrets.create: false` so the regular Secret
# template is skipped — otherwise both will fight over the same
# `metadata.name`.
#
# The remote payload is expected to be a JSON object whose keys are
# the same `NUCEL_*` names the chart's Secret would set
# (NUCEL_DB_PASS, NUCEL_OIDC_PRIVATE_KEY, NUCEL_SSH_HOST_KEY,
# NUCEL_METRICS_TOKEN, NUCEL_HOOK_SECRET, NUCEL_CI_RUNNER_TOKEN,
# NUCEL_OPENROUTER_KEY, NUCEL_S3_ACCESS_KEY_ID, NUCEL_S3_SECRET_ACCESS_KEY,
# NUCEL_DB_USER). The operator extracts each key from the JSON and
# writes them into the target Secret named after the release — same
# name `deployment.yaml` references via `secretKeyRef`.
#
# Gated behind `.Values.externalSecrets.enabled` so the chart still
# renders on clusters that don't have the external-secrets.io CRDs
# installed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "nucel.secretName" . }}
  namespace: {{ include "nucel.namespace" . }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
{{- /* Two remote shapes are supported, mutually exclusive:
       1. Single-blob (remoteRef.key) — one remote secret whose JSON payload
          carries every NUCEL_* key. Rendered as dataFrom.extract so ESO
          splays the JSON into the target Secret.
       2. Per-key map (remoteRefs.<chartKey>: <remotePath>) — one remote
          secret per logical value (oidcPrivateKey, metricsToken, …). Each
          entry becomes a data[] item mapping the NUCEL_* env key to its
          remote path (what values-production.yaml ships).
       At least one must be set when externalSecrets.enabled=true. */}}
{{- $remoteRef := default (dict) .Values.externalSecrets.remoteRef }}
{{- $remoteRefs := default (dict) .Values.externalSecrets.remoteRefs }}
{{- if and (not $remoteRef.key) (not (len (keys $remoteRefs))) }}
{{- fail "externalSecrets.enabled=true requires either externalSecrets.remoteRef.key (single JSON blob) or externalSecrets.remoteRefs (per-key map). See values-production.yaml." }}
{{- end }}
{{- $envFor := dict
      "dbPass" "NUCEL_DB_PASS"
      "oidcPrivateKey" "NUCEL_OIDC_PRIVATE_KEY"
      "sessionKey" "NUCEL_SESSION_KEY"
      "sshHostKey" "NUCEL_SSH_HOST_KEY"
      "metricsToken" "NUCEL_METRICS_TOKEN"
      "hookSecret" "NUCEL_HOOK_SECRET"
      "ciRunnerToken" "NUCEL_CI_RUNNER_TOKEN"
      "openrouterKey" "NUCEL_OPENROUTER_KEY"
      "anthropicApiKey" "ANTHROPIC_API_KEY"
      "gitBotUser" "NUCEL_GIT_USER"
      "gitBotPassword" "NUCEL_GIT_PASSWORD"
      "s3AccessKeyId" "NUCEL_S3_ACCESS_KEY_ID"
      "s3SecretAccessKey" "NUCEL_S3_SECRET_ACCESS_KEY"
      "dbUser" "NUCEL_DB_USER" }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled=true" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "nucel.secretName" . }}
    creationPolicy: Owner
{{- if $remoteRef.key }}
  dataFrom:
    - extract:
        key: {{ $remoteRef.key | quote }}
{{- end }}
{{- if len (keys $remoteRefs) }}
  data:
{{- range $chartKey, $remotePath := $remoteRefs }}
{{- $envKey := index $envFor $chartKey }}
{{- if not $envKey }}
{{- fail (printf "externalSecrets.remoteRefs.%s is not a known secret key. Valid keys: %s" $chartKey (join ", " (keys $envFor))) }}
{{- end }}
    - secretKey: {{ $envKey }}
      remoteRef:
        key: {{ $remotePath | quote }}
{{- end }}
{{- end }}
{{- end }}
