{{- if .Values.surrealdb.deploy }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: surrealdb
  namespace: {{ include "nucel.namespace" . }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
spec:
  serviceName: surrealdb
  replicas: 1
  selector:
    matchLabels:
      {{- include "nucel.surrealdbLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nucel.surrealdbLabels" . | nindent 8 }}
    spec:
      containers:
        - name: surrealdb
          image: {{ .Values.surrealdb.image }}
          args:
            - start
            - --log
            - info
            - --user
            - $(DB_USER)
            - --pass
            - $(DB_PASS)
            - file:/data/nucel.db
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_DB_PASS
          ports:
            - containerPort: 8000
              name: ws
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["surreal", "isready", "--conn", "http://localhost:8000"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["surreal", "isready", "--conn", "http://localhost:8000"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.surrealdb.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.surrealdb.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: surrealdb
  namespace: {{ include "nucel.namespace" . }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nucel.surrealdbLabels" . | nindent 4 }}
  ports:
    - port: 8000
      targetPort: 8000
      name: ws
{{- end }}
