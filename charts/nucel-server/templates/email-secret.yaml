{{- /*
MVP audit L11 — email backend.

Separate Secret object from the main `nucel-secret` because:
  1. SMTP credentials rotate independently from the rest of the platform
     secrets (DB password, OIDC key, etc.) — operators want to rotate
     the SES SMTP credentials without touching anything else.
  2. ExternalSecrets installations frequently source SMTP credentials
     from a different backend path (`secret/email/...` vs
     `secret/nucel/...`) — splitting the Secret means each ExternalSecret
     resource can target its own remote path.

Rendered when `email.smtpUrl` is non-empty AND `secrets.create=true`.
When `email.smtpUrl` is empty the chart ships zero email config and the
server boots in no-op email mode (logs warning, all sends succeed but
do nothing). That keeps preview environments simple — operators opt in
to real mail by setting one Helm value.

NOTE: the deployment wires NUCEL_SMTP_URL with optional: true so a
missing Secret object isn't a CrashLoopBackoff — it's the documented
"no email" mode.
*/}}
{{- if and .Values.secrets.create .Values.email .Values.email.smtpUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nucel.fullname" . }}-email
  namespace: {{ include "nucel.namespace" . }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
type: Opaque
stringData:
  NUCEL_SMTP_URL: {{ .Values.email.smtpUrl | quote }}
{{- end }}
