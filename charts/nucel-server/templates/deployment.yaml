{{- /* #244 — fail-fast on a storage topology that breaks multi-replica
       (RWO PVC or emptyDir on a shared class with replicas > 1 / HPA, or
       backend=s3 on an FS-only class). See _helpers.tpl. */ -}}
{{- include "nucel.storage.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nucel-server
  namespace: {{ include "nucel.namespace" . }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
  annotations:
    checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
spec:
  replicas: {{ .Values.server.replicas }}
  {{- with .Values.server.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nucel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nucel.selectorLabels" . | nindent 8 }}
        # Distinguishes server pods from worker / seed pods deployed
        # off the same chart. The seed Job's podAffinity uses this
        # label to land on the same node as a server pod (RWO PVC
        # constraint when seed.mountRepos is true).
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "nucel.serviceAccountName" . }}
      {{- include "nucel.podSecurityContext" . | nindent 6 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "nucel.containerSecurityContext" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.server.port }}
              name: http
            - containerPort: {{ .Values.server.sshPort }}
              name: ssh
          envFrom:
            - configMapRef:
                name: {{ include "nucel.configMapName" . }}
          env:
            # Fix M5 — schema is applied by the pre-upgrade migration Hook
            # Job, not by each server pod at boot. Skip the in-process
            # apply_schema call to avoid the race when 2+ pods restart
            # together. Gated on migrations.enabled so installs that
            # disable the hook still get schema applied at startup.
            {{- if and .Values.migrations .Values.migrations.enabled }}
            - name: NUCEL_SKIP_SCHEMA
              value: "1"
            {{- end }}
            - name: NUCEL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_DB_USER
            - name: NUCEL_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_DB_PASS
            - name: NUCEL_CI_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_CI_RUNNER_TOKEN
            - name: NUCEL_HOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_HOOK_SECRET
            # OIDC private key: always wired from the Secret. When
            # ExternalSecrets is on (chart-managed Secret is skipped),
            # the ExternalSecret target Secret has the same name so
            # this resolves the same way. The key is required at
            # install-time by `secrets.requireProductionValues` (Fix C8).
            - name: NUCEL_OIDC_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_OIDC_PRIVATE_KEY
                  optional: true
            # B-15 -- shared session cookie signing key. `optional: true`
            # so the pod still boots in dev overlays where the server
            # falls back to the deterministic dev key (when
            # NUCEL_ALLOW_DEV_SECRETS=1 is also set). In production the
            # chart-managed Secret always populates this -- see
            # templates/secret.yaml (lookup + randAlphaNum + required).
            - name: NUCEL_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_SESSION_KEY
                  optional: true
            # AES-256-GCM master key for the secret vault (BYOK keys + CI/org
            # secrets, encrypted at rest before reaching SurrealDB — see
            # crates/nucel-db/src/secret.rs). `optional: true` so the pod still
            # boots in dev overlays where the server falls back to the
            # deterministic dev key (with NUCEL_ALLOW_DEV_SECRETS=1). In
            # production the chart-managed Secret always populates this and the
            # server fails fast at boot if it's missing/weak (main.rs L1 guard).
            # Generate-once-then-preserve — rotating it makes all stored secrets
            # undecryptable (see templates/secret.yaml).
            - name: NUCEL_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_SECRET_ENCRYPTION_KEY
                  optional: true
            # Metrics bearer token (Fix H9 — required when
            # prometheus.requireAuth=true). `optional: true` so the pod
            # still boots in dev overlays that disable the requirement.
            - name: NUCEL_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_METRICS_TOKEN
                  optional: true
            {{- if .Values.secrets.openrouterKey }}
            - name: NUCEL_OPENROUTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_OPENROUTER_KEY
            {{- end }}
            {{- if .Values.secrets.anthropicApiKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: ANTHROPIC_API_KEY
            {{- end }}
            # Bot account for per-run PAT minting (AW dispatch). Optional —
            # when unset, AW K8s dispatch is skipped (stub mode).
            - name: NUCEL_GIT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_GIT_USER
                  optional: true
            - name: NUCEL_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.secretName" . }}
                  key: NUCEL_GIT_PASSWORD
                  optional: true
            # MVP audit L11 — SMTP URL from the email Secret.
            # `optional: true` so the pod still boots when email is
            # unconfigured (e.g. preview environments); EmailSender's
            # no-op branch logs a warning per send in that case.
            - name: NUCEL_SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "nucel.fullname" . }}-email
                  key: NUCEL_SMTP_URL
                  optional: true
            {{- /* Pre-launch HTTP Basic auth gate for the whole alpha.
                   Wired only when basicAuth.enabled — when off, the env
                   is never set so the gate middleware is transparent.
                   Source Secret: chart-managed `<fullname>-basic-auth`
                   (rendered in basic-auth-secret.yaml) or an operator's
                   existingSecret. Both carry key NUCEL_BASIC_AUTH=user:pass. */}}
            {{- if and .Values.basicAuth .Values.basicAuth.enabled }}
            - name: NUCEL_BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.basicAuth.existingSecret | default (printf "%s-basic-auth" (include "nucel.fullname" .)) }}
                  key: NUCEL_BASIC_AUTH
            {{- end }}
            # Fix C9 — SSH host key path. Always set; the file mount
            # under `volumes` below is gated on `secrets.sshHostKey`
            # being non-empty (or being provided via ExternalSecrets).
            # When the file isn't present the server falls back to an
            # ephemeral key and logs a warning (existing behaviour).
            - name: NUCEL_SSH_HOST_KEY_PATH
              value: /etc/nucel/ssh-host-key/NUCEL_SSH_HOST_KEY
            {{- if .Values.agentWorkflows }}
            # AW K8s dispatch — empty url disables runner pod creation.
            {{- if and .Values.agentWorkflows.k8s .Values.agentWorkflows.k8s.url }}
            - name: NUCEL_AW_K8S_URL
              value: {{ .Values.agentWorkflows.k8s.url | quote }}
            - name: NUCEL_AW_K8S_NAMESPACE
              value: {{ .Values.agentWorkflows.k8s.namespace | quote }}
            {{- if .Values.agentWorkflows.k8s.apiUrl }}
            - name: NUCEL_AW_API_URL
              value: {{ .Values.agentWorkflows.k8s.apiUrl | quote }}
            {{- end }}
            {{- if .Values.agentWorkflows.k8s.runnerImage }}
            - name: NUCEL_AW_RUNNER_IMAGE
              value: {{ .Values.agentWorkflows.k8s.runnerImage | quote }}
            {{- end }}
            {{- if .Values.agentWorkflows.k8s.anthropicSecret }}
            - name: NUCEL_AW_ANTHROPIC_SECRET
              value: {{ .Values.agentWorkflows.k8s.anthropicSecret | quote }}
            {{- end }}
            {{- if .Values.agentWorkflows.k8s.openrouterSecret }}
            - name: NUCEL_AW_OPENROUTER_SECRET
              value: {{ .Values.agentWorkflows.k8s.openrouterSecret | quote }}
            {{- end }}
            # Egress NetworkPolicy targeting: tell the dispatcher which
            # namespace + pod selector identify nucel-server so the
            # runner→server callback egress rule is precise. Defaults to
            # this release's own namespace + selectorLabels.
            - name: NUCEL_AW_SERVER_NAMESPACE
              value: {{ .Values.agentWorkflows.k8s.serverNamespace | default (include "nucel.namespace" .) | quote }}
            - name: NUCEL_AW_SERVER_POD_SELECTOR
              value: {{ .Values.agentWorkflows.k8s.serverPodSelector | default (printf "app.kubernetes.io/name=%s" (include "nucel.name" .)) | quote }}
            - name: NUCEL_AW_SERVER_PORT
              value: {{ .Values.server.port | quote }}
            {{- end }}
            - name: NUCEL_AW_TICK_PERIOD_SECS
              value: {{ .Values.agentWorkflows.tickPeriodSeconds | quote }}
            - name: NUCEL_AW_MANUAL_TRIGGER_PER_MIN
              value: {{ .Values.agentWorkflows.manualTriggerPerMin | quote }}
            - name: NUCEL_AW_ORG_MANUAL_TRIGGER_PER_MIN
              value: {{ .Values.agentWorkflows.orgManualTriggerPerMin | quote }}
            - name: NUCEL_AW_DAILY_ORG_USD_CAP
              value: {{ .Values.agentWorkflows.dailyOrgUsdCap | quote }}
            - name: NUCEL_AW_NEEDS_REVIEW_TTL_HOURS
              value: {{ .Values.agentWorkflows.needsReviewTtlHours | quote }}
            - name: NUCEL_AW_RUN_STUCK_TIMEOUT_MIN
              value: {{ .Values.agentWorkflows.runStuckTimeoutMin | quote }}
            - name: NUCEL_AW_AUTO_DISABLE_AFTER_N_FAILS
              value: {{ .Values.agentWorkflows.autoDisableAfterNFails | quote }}
            - name: NUCEL_AW_ORG_MAX_CONCURRENT
              value: {{ .Values.agentWorkflows.orgMaxConcurrent | quote }}
            {{- end }}
          volumeMounts:
            - name: repos
              mountPath: /data/repos
            - name: ci-data
              mountPath: /data/ci
            - name: registry
              mountPath: /data/registry
            - name: npm
              mountPath: /data/npm
            - name: workspaces
              mountPath: /data/workspaces
            {{- /* #244 — pages assets. In fs/pvc/emptyDir mode the server
                   writes to /data/pages; before this fix nothing was
                   mounted there, so assets landed on the ephemeral
                   container layer (wiped on pod cycle, invisible to
                   siblings). When the pages backend is `s3` the server
                   writes straight to object storage and this mount is
                   skipped. */}}
            {{- if ne (include "nucel.storage.backend" (dict "ctx" $ "class" "pages")) "s3" }}
            - name: pages
              mountPath: /data/pages
            {{- end }}
            # Fix C9 — SSH host key file. Volume is `optional: true`
            # so the pod still boots when the key isn't set (server
            # falls back to ephemeral + logs a warning).
            - name: ssh-host-key
              mountPath: /etc/nucel/ssh-host-key
              readOnly: true
          {{- $probes := default (dict) .Values.server.probes }}
          {{- $startup := default (dict) $probes.startup }}
          {{- if $startup.enabled }}
          # Slow-boot gate — liveness is not evaluated until this passes,
          # so a cold-start (DB connect + schema check + SSH host key) is
          # never misread as a crash-loop.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ $startup.periodSeconds | default 5 }}
            failureThreshold: {{ $startup.failureThreshold | default 30 }}
            timeoutSeconds: {{ $startup.timeoutSeconds | default 3 }}
          {{- end }}
          {{- $liveness := default (dict) $probes.liveness }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $liveness.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $liveness.periodSeconds | default 30 }}
            timeoutSeconds: {{ $liveness.timeoutSeconds | default 3 }}
            failureThreshold: {{ $liveness.failureThreshold | default 3 }}
          {{- $readiness := default (dict) $probes.readiness }}
          readinessProbe:
            httpGet:
              # /readyz runs a cheap DB round-trip and returns 503 when
              # SurrealDB is unreachable — Kubernetes pulls the pod from
              # service endpoints without restarting it. /health (liveness)
              # is always-200; using it for readiness would keep the pod in
              # rotation even when the DB is down.
              path: /readyz
              port: http
            initialDelaySeconds: {{ $readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ $readiness.periodSeconds | default 10 }}
            timeoutSeconds: {{ $readiness.timeoutSeconds | default 3 }}
            failureThreshold: {{ $readiness.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        {{- /* #236 / #244 — each data-class volume is rendered from its
               resolved backend. `gitWorkspaces` (repos) and `artifacts`
               (ci-data) always keep a PVC for the local hot path; their
               s3 backend is a cold tier layered on top. registry / npm /
               artifacts / pages honor pvc vs emptyDir per class. */}}
        - name: repos
          persistentVolumeClaim:
            claimName: {{ include "nucel.storage.pvcName" (dict "class" "gitWorkspaces") }}
        - name: ci-data
          persistentVolumeClaim:
            claimName: {{ include "nucel.storage.pvcName" (dict "class" "artifacts") }}
        {{- $registryBackend := include "nucel.storage.backend" (dict "ctx" $ "class" "registry") }}
        - name: registry
          {{- if eq $registryBackend "emptyDir" }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "nucel.storage.pvcName" (dict "class" "registry") }}
          {{- end }}
        {{- $npmBackend := include "nucel.storage.backend" (dict "ctx" $ "class" "npm") }}
        - name: npm
          {{- if eq $npmBackend "emptyDir" }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "nucel.storage.pvcName" (dict "class" "npm") }}
          {{- end }}
        - name: workspaces
          emptyDir: {}
        {{- /* pages volume — only present when the backend is NOT s3
               (matches the conditional mount above). */}}
        {{- $pagesBackend := include "nucel.storage.backend" (dict "ctx" $ "class" "pages") }}
        {{- if ne $pagesBackend "s3" }}
        - name: pages
          {{- if eq $pagesBackend "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "nucel.storage.pvcName" (dict "class" "pages") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        # Fix C9 — SSH host key file projection. The Secret key
        # `NUCEL_SSH_HOST_KEY` is exposed as a file at
        # /etc/nucel/ssh-host-key/NUCEL_SSH_HOST_KEY (matches the env
        # var above). `optional: true` keeps the pod scheduling even
        # when the chart-managed Secret doesn't have the key — useful
        # for ExternalSecrets installs where the key might lag the
        # initial sync.
        - name: ssh-host-key
          secret:
            secretName: {{ include "nucel.secretName" . }}
            optional: true
            defaultMode: 0400
            items:
              - key: NUCEL_SSH_HOST_KEY
                path: NUCEL_SSH_HOST_KEY
