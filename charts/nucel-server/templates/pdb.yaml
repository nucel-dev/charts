{{- /*
PodDisruptionBudget for the main nucel-server Deployment.

Supports both the legacy `.Values.podDisruptionBudget.*` keys and the
new `.Values.pdb.*` knobs (scale-hardening). Either set turning it on
enables the PDB; new installs should prefer the `pdb.*` block.

Keeps at least `minAvailable` server pods up during voluntary
disruptions (node drain, cluster upgrade, Karpenter consolidation).
WARNING: with `server.replicas: 1` (chart default) and
`minAvailable: 1` the PDB will block node drains entirely. Pair this
with `server.replicas >= 2` OR `hpa.enabled: true` (which defaults to
`minReplicas: 2`).
*/ -}}
{{- $pdb := default (dict) .Values.pdb -}}
{{- $legacy := default (dict) .Values.podDisruptionBudget -}}
{{- $enabled := or (and (hasKey $pdb "enabled") $pdb.enabled) (and (hasKey $legacy "enabled") $legacy.enabled) -}}
{{- if $enabled }}
{{- $minAvailable := default $legacy.minAvailable $pdb.minAvailable -}}
{{- $maxUnavailable := default $legacy.maxUnavailable $pdb.maxUnavailable -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nucel-server
  namespace: {{ include "nucel.namespace" . }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
spec:
  {{- if $maxUnavailable }}
  maxUnavailable: {{ $maxUnavailable }}
  {{- else }}
  minAvailable: {{ default 1 $minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nucel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
