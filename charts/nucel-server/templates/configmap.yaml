apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nucel.configMapName" . }}
  namespace: {{ include "nucel.namespace" . }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
data:
  NUCEL_HOST: "0.0.0.0"
  NUCEL_PORT: {{ .Values.server.port | quote }}
  NUCEL_SSH_PORT: {{ .Values.server.sshPort | quote }}
  NUCEL_DB_URL: "ws://surrealdb.{{ include "nucel.namespace" . }}.svc.cluster.local:8000"
  NUCEL_DB_NS: "nucel"
  NUCEL_DB_DB: "main"
  NUCEL_REPO_BASE_PATH: "/data/repos"
  NUCEL_LOG_PATH: "/data/ci/logs"
  NUCEL_ARTIFACT_PATH: "/data/ci/artifacts"
  NUCEL_WORKSPACE_PATH: "/data/workspaces"
  NUCEL_REGISTRY_PATH: "/data/registry"
  NUCEL_NPM_PATH: "/data/npm"
  # #244 — pages assets live on a mounted volume (see deployment.yaml). The
  # binary defaults this to /data/pages; set explicitly so the mount path
  # and the server agree.
  NUCEL_PAGES_PATH: "/data/pages"
  NUCEL_LOG_LEVEL: {{ .Values.logging.level | quote }}
  RUST_LOG: {{ .Values.logging.rustLog | quote }}
  NUCEL_OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  # OCI registry: the public origin docker/podman/skopeo clients reach this
  # registry on. It becomes the `realm` of the
  # `WWW-Authenticate: Bearer realm="<origin>/v2/token"` challenge — i.e. the
  # URL every client is told to send its credentials to. A wrong value is a
  # credential-disclosure bug, not just a broken handshake.
  #
  # Do NOT confuse this with `NUCEL_BASE_URL` (`email.baseUrl`), which is the
  # EMAIL origin. Leaving this unset makes the server fall back to
  # `NUCEL_OIDC_ISSUER` and then to the request's own Host, and refuse (with an
  # `error!` log) any configured origin that names a different host than the
  # request arrived on.
  {{- if .Values.registry }}
  {{- if .Values.registry.externalUrl }}
  NUCEL_REGISTRY_EXTERNAL_URL: {{ .Values.registry.externalUrl | quote }}
  {{- end }}
  {{- end }}
  # Browsers silently drop a Secure cookie over plain HTTP, so this
  # opts in only when the deployment sits behind HTTPS (typical
  # production / preview environments). Defaults to "1" because
  # ingress.tls is true by default in this chart.
  {{- if and .Values.cookies .Values.cookies.secure }}
  NUCEL_SECURE_COOKIE: {{ .Values.cookies.secure | quote }}
  {{- else }}
  NUCEL_SECURE_COOKIE: "1"
  {{- end }}
  NUCEL_CI_K8S_NAMESPACE: {{ .Values.ciNamespace | quote }}
  NUCEL_CI_API_URL: "http://nucel-server.{{ include "nucel.namespace" . }}.svc.cluster.local:{{ .Values.server.port }}"
  # Repo storage backend selection (T1-9). `local` keeps repos on the
  # PVC; `s3` enables the cold tier on object storage (local PVC stays
  # as the hot cache).
  #
  # Precedence: the new `storage.classes.gitWorkspaces.backend=s3` (#236)
  # turns on the cold tier; otherwise the legacy `repoStorage.kind` is
  # honored. The local /data/repos PVC always remains the hot cache.
  {{- $gwClass := default (dict) (index (default (dict) (default (dict) .Values.storage).classes) "gitWorkspaces") }}
  {{- $gwS3 := default (dict) $gwClass.s3 }}
  {{- $repoS3legacy := default (dict) (default (dict) .Values.repoStorage).s3 }}
  {{- $repoS3on := or (eq (default "" $gwClass.backend) "s3") (and .Values.repoStorage (eq (.Values.repoStorage.kind | default "") "s3")) }}
  {{- if $repoS3on }}
  NUCEL_REPO_STORAGE: "s3"
  NUCEL_S3_BUCKET: {{ (default $repoS3legacy.bucket $gwS3.bucket) | default "" | quote }}
  NUCEL_S3_PREFIX: {{ (default $repoS3legacy.prefix $gwS3.prefix) | default "repos/" | quote }}
  NUCEL_S3_REGION: {{ (default $repoS3legacy.region $gwS3.region) | default "eu-central-1" | quote }}
  {{- $repoEndpoint := (default $repoS3legacy.endpoint $gwS3.endpoint) | default "" }}
  {{- with $repoEndpoint }}
  NUCEL_S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- else }}
  NUCEL_REPO_STORAGE: "local"
  {{- end }}
  # Pages asset storage backend. `fs` writes assets to the mounted pages
  # volume (single-replica only — 50% 404 race with 2+ replicas unless that
  # volume is ReadWriteMany). `s3` uploads each file so every replica serves
  # identical bytes — the recommended multi-replica path (#244).
  #
  # Precedence: the new `storage.classes.pages.backend` (#236) wins when set
  # to `s3`; otherwise the legacy `pagesStorage.kind` is honored. Empty s3.*
  # fields fall back to repoStorage.s3.* (shared bucket, different prefix).
  {{- $pagesClass := default (dict) (index (default (dict) (default (dict) .Values.storage).classes) "pages") }}
  {{- $pagesS3FromClass := eq (default "" $pagesClass.backend) "s3" }}
  {{- $pagesS3FromLegacy := and .Values.pagesStorage (eq (.Values.pagesStorage.kind | default "") "s3") }}
  {{- $classS3 := default (dict) $pagesClass.s3 }}
  {{- $legacyS3 := default (dict) (default (dict) .Values.pagesStorage).s3 }}
  {{- $repoS3 := default (dict) (default (dict) .Values.repoStorage).s3 }}
  {{- if or $pagesS3FromClass $pagesS3FromLegacy }}
  NUCEL_PAGES_STORAGE: "s3"
  NUCEL_PAGES_S3_BUCKET: {{ (default $legacyS3.bucket $classS3.bucket) | default $repoS3.bucket | default "" | quote }}
  NUCEL_PAGES_S3_PREFIX: {{ (default $legacyS3.prefix $classS3.prefix) | default "pages/" | quote }}
  NUCEL_PAGES_S3_REGION: {{ (default $legacyS3.region $classS3.region) | default $repoS3.region | default "eu-central-1" | quote }}
  {{- $pagesEndpoint := (default $legacyS3.endpoint $classS3.endpoint) | default $repoS3.endpoint | default "" }}
  {{- with $pagesEndpoint }}
  NUCEL_PAGES_S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- else }}
  NUCEL_PAGES_STORAGE: "fs"
  {{- end }}
  # MVP audit L11 — email backend. `NUCEL_SMTP_URL` lives in the
  # email Secret (always contains creds). `NUCEL_EMAIL_FROM` and
  # `NUCEL_BASE_URL` are plain config because they're not secret —
  # leaking the From address or the public base URL is harmless.
  {{- if .Values.email }}
  {{- if .Values.email.from }}
  NUCEL_EMAIL_FROM: {{ .Values.email.from | quote }}
  {{- end }}
  {{- if .Values.email.baseUrl }}
  NUCEL_BASE_URL: {{ .Values.email.baseUrl | quote }}
  {{- end }}
  NUCEL_REQUIRE_VERIFIED_EMAIL: {{ .Values.email.requireVerifiedEmail | default false | quote }}
  {{- end }}
  # Closed-beta + super-admin knobs. Plain config (not secrets):
  #   NUCEL_INVITE_ONLY  — true gates public registration behind a valid
  #     signup-invite token (waitlist+approve flow).
  #   NUCEL_ADMIN_USERS  — comma-separated usernames granted the /admin
  #     operator portal + /api/v1/admin/*. Empty ⇒ nobody is admin.
  # Always emitted so flipping the value in an overlay rolls the Deployment
  # (the env is the trust anchor; there is no in-DB admin flag).
  NUCEL_INVITE_ONLY: {{ .Values.server.inviteOnly | default false | quote }}
  NUCEL_ADMIN_USERS: {{ .Values.server.adminUsers | default "" | quote }}
