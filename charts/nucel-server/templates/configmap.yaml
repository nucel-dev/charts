apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nucel.configMapName" . }}
  namespace: {{ include "nucel.namespace" . }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
data:
  NUCEL_HOST: "0.0.0.0"
  NUCEL_PORT: {{ .Values.server.port | quote }}
  NUCEL_SSH_PORT: {{ .Values.server.sshPort | quote }}
  NUCEL_DB_URL: "ws://surrealdb.{{ include "nucel.namespace" . }}.svc.cluster.local:8000"
  NUCEL_DB_NS: "nucel"
  NUCEL_DB_DB: "main"
  NUCEL_REPO_BASE_PATH: "/data/repos"
  NUCEL_LOG_PATH: "/data/ci/logs"
  NUCEL_ARTIFACT_PATH: "/data/ci/artifacts"
  NUCEL_WORKSPACE_PATH: "/data/workspaces"
  NUCEL_REGISTRY_PATH: "/data/registry"
  NUCEL_NPM_PATH: "/data/npm"
  NUCEL_LOG_LEVEL: {{ .Values.logging.level | quote }}
  RUST_LOG: {{ .Values.logging.rustLog | quote }}
  NUCEL_OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  # Browsers silently drop a Secure cookie over plain HTTP, so this
  # opts in only when the deployment sits behind HTTPS (typical
  # production / preview environments). Defaults to "1" because
  # ingress.tls is true by default in this chart.
  {{- if and .Values.cookies .Values.cookies.secure }}
  NUCEL_SECURE_COOKIE: {{ .Values.cookies.secure | quote }}
  {{- else }}
  NUCEL_SECURE_COOKIE: "1"
  {{- end }}
  NUCEL_CI_K8S_NAMESPACE: {{ .Values.ciNamespace | quote }}
  NUCEL_CI_API_URL: "http://nucel-server.{{ include "nucel.namespace" . }}.svc.cluster.local:{{ .Values.server.port }}"
  # Repo storage backend selection (T1-9). `local` keeps repos on the
  # PVC; `s3` enables the cold tier on object storage (local PVC stays
  # as the hot cache).
  {{- if .Values.repoStorage }}
  NUCEL_REPO_STORAGE: {{ .Values.repoStorage.kind | default "local" | quote }}
  {{- if eq (.Values.repoStorage.kind | default "") "s3" }}
  NUCEL_S3_BUCKET: {{ .Values.repoStorage.s3.bucket | quote }}
  NUCEL_S3_PREFIX: {{ .Values.repoStorage.s3.prefix | quote }}
  NUCEL_S3_REGION: {{ .Values.repoStorage.s3.region | quote }}
  {{- with .Values.repoStorage.s3.endpoint }}
  NUCEL_S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- else }}
  NUCEL_REPO_STORAGE: "local"
  {{- end }}
