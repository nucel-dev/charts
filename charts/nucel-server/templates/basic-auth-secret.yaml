{{- /*
Pre-launch HTTP Basic auth gate for the WHOLE app (neoconto alpha is
unpublished). Rendered only when:
  - basicAuth.enabled              (the gate is armed)
  - basicAuth.existingSecret == "" (operator is NOT managing it out-of-band)
  - secrets.create                 (chart is allowed to render Secrets)

Carries a single key NUCEL_BASIC_AUTH=<user>:<password>, consumed by the
server Deployment via secretKeyRef. The Rust middleware in
`nucel_server::basic_auth` 401s any request lacking a matching
`Authorization: Basic` header; health/metrics paths + kube-probe /
ELB-HealthChecker User-Agents bypass it so probes stay green.

Mirrors the marketing site's `nucel-web-basic-auth` Secret. To reuse that
exact Secret instead, set basicAuth.existingSecret to its name (its key
must be NUCEL_BASIC_AUTH, not STAGING_BASIC_AUTH).

Pass the password via --set so it never lands in git:
  --set basicAuth.enabled=true --set basicAuth.password=...
*/}}
{{- if and .Values.basicAuth .Values.basicAuth.enabled (not .Values.basicAuth.existingSecret) .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nucel.fullname" . }}-basic-auth
  namespace: {{ include "nucel.namespace" . }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
type: Opaque
stringData:
  NUCEL_BASIC_AUTH: {{ printf "%s:%s" (.Values.basicAuth.user | default "nucel") (required "basicAuth.password is required when basicAuth.enabled=true and no existingSecret is set. Pass via --set basicAuth.password=..." .Values.basicAuth.password) | quote }}
{{- end }}
