{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nucel.secretName" . }}
  namespace: {{ include "nucel.namespace" . }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
type: Opaque
data:
  # B-15 -- `NUCEL_SESSION_KEY` is the cookie signing key shared across
  # every nucel-server replica. Without a shared key, each pod signs
  # `nucel_session` cookies with its own ephemeral
  # `tower_sessions::cookie::Key`; any request the load balancer routes
  # to a sibling pod fails signature validation and the user is logged
  # out at random.
  #
  # Lives in `data:` (not `stringData:` below) so the `lookup` branch
  # can carry the existing base64 value forward verbatim across
  # upgrades. On first install we generate a random 64-byte key; every
  # subsequent `helm upgrade` reuses it via `lookup`. Rotating the key
  # is intentionally operator-driven (set `secrets.sessionKey`) because
  # rotation invalidates every active session cluster-wide.
  {{- $existing := lookup "v1" "Secret" (include "nucel.namespace" .) (include "nucel.secretName" .) }}
  {{- if .Values.secrets.sessionKey }}
  NUCEL_SESSION_KEY: {{ .Values.secrets.sessionKey | b64enc | quote }}
  {{- else if and $existing $existing.data (index $existing.data "NUCEL_SESSION_KEY") }}
  NUCEL_SESSION_KEY: {{ index $existing.data "NUCEL_SESSION_KEY" | quote }}
  {{- else if .Values.secrets.requireProductionValues }}
  NUCEL_SESSION_KEY: {{ required "secrets.sessionKey is required when secrets.create=true AND secrets.requireProductionValues=true (B-15 -- cookie signing key shared across replicas). Generate one with: openssl rand -hex 64. See charts/nucel-server/README.md." .Values.secrets.sessionKey | b64enc | quote }}
  {{- else }}
  # Dev-overlay fallback: 64 chars of randAlphaNum on first render,
  # then pinned by the `lookup` branch above on every subsequent
  # upgrade. The Rust loader accepts raw ASCII >= 64 bytes (it does
  # not require hex) so randAlphaNum output works directly.
  NUCEL_SESSION_KEY: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  # Fix C9 — SSH host key. Mounted as a file by `deployment.yaml`;
  # `NUCEL_SSH_HOST_KEY_PATH` in the configmap points at the mount.
  #
  # Auto-generation behaviour (mirrors `NUCEL_SESSION_KEY` above so the
  # `lookup` branch can carry the existing base64 value forward verbatim
  # across upgrades — putting this in `stringData` would re-base64 the
  # PEM payload):
  #   1. Operator-supplied (`.Values.secrets.sshHostKey`) wins — for installs
  #      that want a known, externally-rotated host key.
  #   2. Otherwise carry forward the existing value via `lookup` on every
  #      `helm upgrade` so the key is stable across releases (no
  #      `known_hosts` MITM churn for git clients).
  #   3. On first install when neither is present, generate a fresh
  #      Ed25519 key with `genPrivateKey "ed25519"` (PKCS#8 PEM). The
  #      `russh-keys` crate accepts both OpenSSH and PKCS#8 PEM Ed25519
  #      keys (see crates/nucel-server/src/ssh/mod.rs::load_or_generate_host_key).
  #
  # This eliminates the "SSH server failed to start: No such file or
  # directory" warning on fresh installs without requiring operators
  # to pre-generate and inject a host key.
  {{- if .Values.secrets.sshHostKey }}
  NUCEL_SSH_HOST_KEY: {{ .Values.secrets.sshHostKey | b64enc | quote }}
  {{- else if and $existing $existing.data (index $existing.data "NUCEL_SSH_HOST_KEY") }}
  NUCEL_SSH_HOST_KEY: {{ index $existing.data "NUCEL_SSH_HOST_KEY" | quote }}
  {{- else }}
  NUCEL_SSH_HOST_KEY: {{ genPrivateKey "ed25519" | b64enc | quote }}
  {{- end }}
stringData:
  NUCEL_DB_USER: {{ .Values.secrets.dbUser | quote }}
  NUCEL_DB_PASS: {{ .Values.secrets.dbPass | quote }}
  NUCEL_CI_RUNNER_TOKEN: {{ .Values.secrets.ciRunnerToken | quote }}
  NUCEL_HOOK_SECRET: {{ .Values.secrets.hookSecret | quote }}
  # Fix C8 — `required` only fires when both `secrets.create` and
  # `secrets.requireProductionValues` are true. The branching keeps the
  # local-dev override (`requireProductionValues: false`) able to render
  # with an empty key, while production installs fail fast at
  # `helm install/upgrade` time instead of booting with an ephemeral
  # Ed25519 key that invalidates every previously-issued OIDC ID token
  # on the next pod restart.
  {{- if .Values.secrets.requireProductionValues }}
  NUCEL_OIDC_PRIVATE_KEY: {{ required "secrets.oidcPrivateKey is required when secrets.create=true AND secrets.requireProductionValues=true. Generate one with: openssl genpkey -algorithm ED25519. See charts/nucel-server/PRODUCTION_HARDENING.md (Fix C8)." .Values.secrets.oidcPrivateKey | quote }}
  {{- else if .Values.secrets.oidcPrivateKey }}
  NUCEL_OIDC_PRIVATE_KEY: {{ .Values.secrets.oidcPrivateKey | quote }}
  {{- end }}
  # Fix H9 — `required` only fires when `prometheus.requireAuth` is on.
  # /metrics shares the public ingress listener; leaving the token
  # empty exposes bg_job kinds + dispatch counters to anyone on the
  # internet. Flip `prometheus.requireAuth: false` in dev overlays.
  {{- if and .Values.prometheus .Values.prometheus.requireAuth }}
  NUCEL_METRICS_TOKEN: {{ required "secrets.metricsToken is required when prometheus.requireAuth=true. Generate one with: openssl rand -base64 32. See charts/nucel-server/PRODUCTION_HARDENING.md (Fix H9)." .Values.secrets.metricsToken | quote }}
  {{- else if .Values.secrets.metricsToken }}
  NUCEL_METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  {{- end }}
  {{- if .Values.secrets.openrouterKey }}
  NUCEL_OPENROUTER_KEY: {{ .Values.secrets.openrouterKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.gitBotUser }}
  NUCEL_GIT_USER: {{ .Values.secrets.gitBotUser | quote }}
  NUCEL_GIT_PASSWORD: {{ .Values.secrets.gitBotPassword | quote }}
  {{- end }}
  {{- if and .Values.repoStorage (eq .Values.repoStorage.kind "s3") .Values.repoStorage.s3 .Values.repoStorage.s3.accessKeyId }}
  NUCEL_S3_ACCESS_KEY_ID: {{ .Values.repoStorage.s3.accessKeyId | quote }}
  NUCEL_S3_SECRET_ACCESS_KEY: {{ .Values.repoStorage.s3.secretAccessKey | quote }}
  {{- end }}
  {{- if and .Values.pagesStorage (eq .Values.pagesStorage.kind "s3") .Values.pagesStorage.s3 .Values.pagesStorage.s3.accessKeyId }}
  NUCEL_PAGES_S3_ACCESS_KEY_ID: {{ .Values.pagesStorage.s3.accessKeyId | quote }}
  NUCEL_PAGES_S3_SECRET_ACCESS_KEY: {{ .Values.pagesStorage.s3.secretAccessKey | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.ciOperator.enabled .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: nucel-ci-runner-secret
  namespace: {{ .Values.ciNamespace }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
type: Opaque
stringData:
  NUCEL_RUNNER_TOKEN: {{ .Values.ciOperator.runnerToken | default .Values.secrets.ciRunnerToken | quote }}
  NUCEL_API_URL: "http://nucel-server.{{ include "nucel.namespace" . }}.svc.cluster.local:{{ .Values.server.port }}"
{{- end }}
{{- if and .Values.ciOperator.enabled .Values.secrets.create .Values.secrets.anthropicApiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nucel-aw-anthropic
  namespace: {{ .Values.ciNamespace }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
{{- end }}
{{- if and .Values.ciOperator.enabled .Values.secrets.create .Values.secrets.openrouterKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nucel-aw-openrouter
  namespace: {{ .Values.ciNamespace }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
type: Opaque
stringData:
  NUCEL_OPENROUTER_KEY: {{ .Values.secrets.openrouterKey | quote }}
{{- end }}
