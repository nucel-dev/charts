{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nucel.secretName" . }}
  namespace: {{ include "nucel.namespace" . }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
type: Opaque
stringData:
  NUCEL_DB_USER: {{ .Values.secrets.dbUser | quote }}
  NUCEL_DB_PASS: {{ .Values.secrets.dbPass | quote }}
  NUCEL_CI_RUNNER_TOKEN: {{ .Values.secrets.ciRunnerToken | quote }}
  NUCEL_HOOK_SECRET: {{ .Values.secrets.hookSecret | quote }}
  # Fix C8 — `required` only fires when both `secrets.create` and
  # `secrets.requireProductionValues` are true. The branching keeps the
  # local-dev override (`requireProductionValues: false`) able to render
  # with an empty key, while production installs fail fast at
  # `helm install/upgrade` time instead of booting with an ephemeral
  # Ed25519 key that invalidates every previously-issued OIDC ID token
  # on the next pod restart.
  {{- if .Values.secrets.requireProductionValues }}
  NUCEL_OIDC_PRIVATE_KEY: {{ required "secrets.oidcPrivateKey is required when secrets.create=true AND secrets.requireProductionValues=true. Generate one with: openssl genpkey -algorithm ED25519. See charts/nucel-server/PRODUCTION_HARDENING.md (Fix C8)." .Values.secrets.oidcPrivateKey | quote }}
  {{- else if .Values.secrets.oidcPrivateKey }}
  NUCEL_OIDC_PRIVATE_KEY: {{ .Values.secrets.oidcPrivateKey | quote }}
  {{- end }}
  # Fix C9 — SSH host key. Mounted as a file by `deployment.yaml`;
  # `NUCEL_SSH_HOST_KEY_PATH` in the configmap points at the mount.
  # Optional (empty -> ephemeral host key, server logs a warning).
  {{- if .Values.secrets.sshHostKey }}
  NUCEL_SSH_HOST_KEY: {{ .Values.secrets.sshHostKey | quote }}
  {{- end }}
  # Fix H9 — `required` only fires when `prometheus.requireAuth` is on.
  # /metrics shares the public ingress listener; leaving the token
  # empty exposes bg_job kinds + dispatch counters to anyone on the
  # internet. Flip `prometheus.requireAuth: false` in dev overlays.
  {{- if and .Values.prometheus .Values.prometheus.requireAuth }}
  NUCEL_METRICS_TOKEN: {{ required "secrets.metricsToken is required when prometheus.requireAuth=true. Generate one with: openssl rand -base64 32. See charts/nucel-server/PRODUCTION_HARDENING.md (Fix H9)." .Values.secrets.metricsToken | quote }}
  {{- else if .Values.secrets.metricsToken }}
  NUCEL_METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  {{- end }}
  {{- if .Values.secrets.openrouterKey }}
  NUCEL_OPENROUTER_KEY: {{ .Values.secrets.openrouterKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.gitBotUser }}
  NUCEL_GIT_USER: {{ .Values.secrets.gitBotUser | quote }}
  NUCEL_GIT_PASSWORD: {{ .Values.secrets.gitBotPassword | quote }}
  {{- end }}
  {{- if and .Values.repoStorage (eq .Values.repoStorage.kind "s3") .Values.repoStorage.s3 .Values.repoStorage.s3.accessKeyId }}
  NUCEL_S3_ACCESS_KEY_ID: {{ .Values.repoStorage.s3.accessKeyId | quote }}
  NUCEL_S3_SECRET_ACCESS_KEY: {{ .Values.repoStorage.s3.secretAccessKey | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.ciOperator.enabled .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: nucel-ci-runner-secret
  namespace: {{ .Values.ciNamespace }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
type: Opaque
stringData:
  NUCEL_RUNNER_TOKEN: {{ .Values.ciOperator.runnerToken | default .Values.secrets.ciRunnerToken | quote }}
  NUCEL_API_URL: "http://nucel-server.{{ include "nucel.namespace" . }}.svc.cluster.local:{{ .Values.server.port }}"
{{- end }}
{{- if and .Values.ciOperator.enabled .Values.secrets.create .Values.secrets.anthropicApiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nucel-aw-anthropic
  namespace: {{ .Values.ciNamespace }}
  labels:
    {{- include "nucel.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
{{- end }}
