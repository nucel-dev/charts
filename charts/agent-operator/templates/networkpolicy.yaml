{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-operator.fullname" . }}-webhook
  namespace: {{ include "agent-operator.namespace" . }}
  labels:
    {{- include "agent-operator.webhookLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-operator.webhookSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- with .Values.networkPolicy.ingress.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.webhook.service.port }}
  egress:
    # DNS is always permitted so the operator/webhook can resolve external APIs.
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.egress.denyAll }}
    {{- with .Values.networkPolicy.egress.to }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- else }}
    # egress.denyAll: false → allow all other egress (K8s API, GitHub, Anthropic, Jira, nucel-git).
    - {}
    {{- end }}
{{- end }}
