---
# Operator ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent-operator.fullname" . }}
  labels:
    {{- include "agent-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-operator.fullname" . }}
    namespace: {{ include "agent-operator.namespace" . }}
---
# Webhook ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent-operator.fullname" . }}-webhook
  labels:
    {{- include "agent-operator.webhookLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent-operator.fullname" . }}-webhook
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-operator.fullname" . }}-webhook
    namespace: {{ include "agent-operator.namespace" . }}
