{{- if .Values.secrets.create }}
---
# Operator secrets (GitHub credentials, Anthropic API key)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-operator.secretName" . }}
  namespace: {{ include "agent-operator.namespace" . }}
  labels:
    {{- include "agent-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.githubAppId }}
  github-app-id: {{ .Values.secrets.githubAppId | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAppPrivateKey }}
  github-app-private-key: {{ .Values.secrets.githubAppPrivateKey | quote }}
  {{- end }}
  {{- if .Values.secrets.githubAppInstallationId }}
  github-app-installation-id: {{ .Values.secrets.githubAppInstallationId | quote }}
  {{- end }}
  {{- if .Values.secrets.githubToken }}
  github-token: {{ .Values.secrets.githubToken | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.nucelGitApiKey }}
  nucel-git-api-key: {{ .Values.secrets.nucelGitApiKey | quote }}
  {{- end }}
---
# Webhook secrets (webhook verification, API token)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-operator.webhookSecretName" . }}
  namespace: {{ include "agent-operator.namespace" . }}
  labels:
    {{- include "agent-operator.webhookLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.githubWebhookSecret }}
  github-webhook-secret: {{ .Values.secrets.githubWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.webhookApiToken }}
  api-token: {{ .Values.secrets.webhookApiToken | quote }}
  {{- end }}
  {{- if .Values.secrets.jiraWebhookSecret }}
  jira-webhook-secret: {{ .Values.secrets.jiraWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.nucelWebhookSecret }}
  nucel-webhook-secret: {{ .Values.secrets.nucelWebhookSecret | quote }}
  {{- end }}
{{- end }}
