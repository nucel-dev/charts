apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-operator.fullname" . }}-webhook
  namespace: {{ include "agent-operator.namespace" . }}
  labels:
    {{- include "agent-operator.webhookLabels" . | nindent 4 }}
spec:
  type: {{ .Values.webhook.service.type }}
  selector:
    {{- include "agent-operator.webhookSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.webhook.service.port }}
      targetPort: http
      protocol: TCP
